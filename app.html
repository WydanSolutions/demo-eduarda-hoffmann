    : `<button class="btn btn-linea" onclick="compartirLista()">${ico('wa')} Enviar a lista</button>
      <button class="btn btn-linea" onclick="traerFaltantes()">${ico('carrito')} Trazer o que falta</button>
      <button class="btn btn-oro" onclick="formItemLista()">${ico('mas')} Adicionar à lista</button>`);
  $('#vista').innerHTML = `
    <div class="pestanas">
      <button class="pestana ${enStock ? 'on' : ''}" onclick="STK.tab='stock'; RENDER.insumos(); activarRevelado()">${ico('stock')} Meus materiais <span class="n">${todos.length}</span></button>
      <button class="pestana ${!enStock ? 'on' : ''}" onclick="STK.tab='lista'; RENDER.insumos(); activarRevelado()">${ico('carrito')} Lista de compras <span class="n">${pend.length}</span></button>
    </div>
    <div class="grid g-4 revelar ${enStock ? "" : "solo-compu"}">
      <div class="kpi ${bajos.length ? 'alerta' : ''}" style="cursor:pointer" onclick="STK.tab='stock'; STK.soloBajo=true; RENDER.insumos(); activarRevelado()"><div class="kpi-l">${ico('alerta')} No mínimo</div><div class="kpi-v">${bajos.length}</div><div class="kpi-d">${bajos.filter(p => p.stock <= 0).length} sem estoque · ${bajos.filter(p => !enLista(p.id)).length} fora da lista</div></div>
      <div class="kpi ${venc.some(p => estadoVence(p) === 'vencido') ? 'alerta' : ''}"><div class="kpi-l">${ico('reloj')} Perto da validade</div><div class="kpi-v">${venc.length}</div><div class="kpi-d">${venc.filter(p => estadoVence(p) === 'vencido').length} vencidos · os outros em ${DIAS_AVISO_VENCE} dias</div></div>
      <div class="kpi" style="cursor:pointer" onclick="STK.tab='lista'; RENDER.insumos(); activarRevelado()"><div class="kpi-l">${ico('carrito')} Lista de compras</div><div class="kpi-v">${pend.length}</div><div class="kpi-d">estimado ${pesos(totalLista(pend))}</div></div>
      <div class="kpi"><div class="kpi-l">${ico('dinero')} Valor a custo</div><div class="kpi-v">${pesos(todos.reduce((s, p) => s + p.stock * p.costo, 0))}</div><div class="kpi-d">o que você tem guardado</div></div>
    </div>
    ${enStock ? htmlMisInsumos() : htmlLista()}`;
  if (enStock) pintarStock();
  pintarFab();
};

/* ---------- Mis insumos ---------- */
function htmlMisInsumos(){
  const marcar = 'this.parentNode.querySelectorAll(\'.pildora\').forEach(b=>b.classList.remove(\'on\')); this.classList.add(\'on\')';
  return `<div class="herr mt">
      <div class="buscar">${ico('buscar')}<input type="search" placeholder="Buscar material…" value="${esc(STK.q)}" oninput="STK.q=this.value; pintarStock()"></div>
      <div class="pildoras"><button class="pildora ${!STK.cat ? 'on' : ''}" onclick="STK.cat=''; pintarStock(); ${marcar}">Todos</button>
        ${CAT_INSUMO.map(c => `<button class="pildora ${STK.cat === c ? 'on' : ''}" onclick="STK.cat='${c}'; pintarStock(); ${marcar}">${c}</button>`).join('')}</div>
      <label class="interruptor"><input type="checkbox" ${STK.soloBajo ? 'checked' : ''} onchange="STK.soloBajo=this.checked; pintarStock()"> Só o que está no mínimo</label>
    </div>
    <div class="caja-info" style="margin-bottom:12px">${ico('info')}<div>Mude a quantidade com <b>−</b> e <b>+</b> ou digitando («tenho 3 top coats»). Quando chega no <b>mínimo</b>, fica marcado e você pode trazer para a lista de compras.</div></div>
    <div class="tabla-caja revelar" id="stk-lista"></div>`;
}
function pintarStock(){
  const q = STK.q.toLowerCase(), orden = { sin:0, bajo:1, ok:2 };
  const lista = D().insumos.filter(p => (!STK.cat || p.cat === STK.cat) && (!STK.soloBajo || estadoStock(p) !== 'ok') && (!q || p.nombre.toLowerCase().includes(q)))
    .sort((a, b) => orden[estadoStock(a)] - orden[estadoStock(b)] || a.nombre.localeCompare(b.nombre));
  $('#stk-lista').innerHTML = lista.length ? `<div class="tabla-scroll"><table class="tabla tabla-ins"><thead><tr><th>Material</th><th>Tenho</th><th>Mínimo</th><th>Validade</th><th>Status</th><th class="derecha"></th></tr></thead><tbody>
    ${lista.map(p => { const l = enLista(p.id);
      return `<tr><td><div class="fuerte">${esc(p.nombre)}</div><div class="persona-s">${esc(p.cat)} · ${pesos(p.costo)} cada</div></td>
        <td><div class="contador"><button onclick="sumarStock('${p.id}',-1)" aria-label="Um a menos" ${p.stock <= 0 ? 'disabled' : ''}>−</button>
          <input type="number" min="0" value="${p.stock}" onchange="fijarStock('${p.id}', this.value)" aria-label="Quantidade de ${esc(p.nombre)}">
          <button onclick="sumarStock('${p.id}',1)" aria-label="Um a mais">+</button></div></td>
        <td><input class="min-inp" type="number" min="0" value="${p.min}" onchange="fijarMinimo('${p.id}', this.value)" aria-label="Mínimo de ${esc(p.nombre)}"></td>
        <td>${chipVence(p)}</td>
        <td>${chipStock(p)}</td>
        <td class="derecha" style="white-space:nowrap">
          ${l ? `<span class="chip c-oro sin-punto">${ico('carrito')} Na lista</span>` : `<button class="btn btn-suave btn-xs" onclick="aLaLista('${p.id}')">${ico('carrito')} Para a lista</button>`}
          <button class="icon-btn" style="width:30px;height:30px" onclick="formInsumo('${p.id}')" aria-label="Editar">${ico('editar')}</button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="vacio">${ico('stock')}${STK.soloBajo ? 'Não falta nada!' : 'Nenhum material com essa busca.'}</div>`;
  $('#stk-lista').classList.add('visible');
}
// Cambiar la cantidad sin volver a dibujar toda la pantalla (así no se pierde el lugar en la lista)
function sumarStock(id, n){ const p = insumo(id); fijarStock(id, Math.max(0, p.stock + n)); }
function fijarStock(id, v){
  const p = insumo(id), nuevo = Math.max(0, Math.round(Number(v) || 0));
  if (nuevo === p.stock){ pintarStock(); return; }
  const antes = estadoStock(p);
  D().ajustes.push({ id:Store.id('aj'), fecha:hoy(), ins:id, cant:nuevo - p.stock, motivo:'Quantidade atualizada' });
  p.stock = nuevo; guardar(); pintarNav(); pintarStock();
  if (estadoStock(p) !== 'ok' && antes === 'ok') avisar(p.nombre + ' chegou no mínimo' + (enLista(id) ? '' : ': você pode passar para a lista de compras'), 'alerta');
}
function fijarMinimo(id, v){ const p = insumo(id); p.min = Math.max(0, Math.round(Number(v) || 0)); guardar(); pintarNav(); pintarStock(); }

function formInsumo(id){
  const p = id ? insumo(id) : { nombre:'', cat:STK.cat || CAT_INSUMO[0], stock:0, min:1, costo:'', vence:'' };
  abrirModal({
    titulo: id ? 'Editar material' : 'Novo material',
    cuerpo: `<form class="form" id="f-ins" onsubmit="return false">
      ${campo('Nome', inp('nombre', p.nombre, 'text', 'placeholder="Ex.: Top coat brilho"'), { ancho:true })}
      ${campo('Grupo', sel('cat', CAT_INSUMO, p.cat))}
      ${campo('Custo por unidade (R$)', inp('costo', p.costo, 'number', 'min="0"'))}
      ${campo('Quantos tenho', inp('stock', p.stock, 'number', 'min="0"'))}
      ${campo('Estoque mínimo', inp('min', p.min, 'number', 'min="0"'), { ayuda:'Ao chegar neste número, fica marcado para comprar.' })}
      ${campo('Validade (opcional)', inp('vence', p.vence, 'date'), { ancho:true, ayuda:'A data do que está aberto ou do que vence primeiro. Avisa ' + DIAS_AVISO_VENCE + ' dias antes.' })}
    </form>`,
    pie: (id ? `<button class="btn btn-peligro izq" onclick="borrarInsumo('${id}')">${ico('borrar')} Excluir</button>` : '') +
      `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="guardarInsumo('${id || ''}')">Salvar</button>`
  });
}
function guardarInsumo(id){
  const v = leerForm($('#f-ins')); if (!v.nombre) return avisar('Escreva o nome', 'alerta');
  ['stock','min','costo'].forEach(k => v[k] = Number(v[k]) || 0);
  if (id){ const p = insumo(id); if (p.stock !== v.stock) D().ajustes.push({ id:Store.id('aj'), fecha:hoy(), ins:id, cant:v.stock - p.stock, motivo:'Quantidade atualizada' }); Object.assign(p, v); }
  else { v.id = Store.id('i'); D().insumos.push(v); }
  guardar(); cerrarModal(); refrescar(); avisar('Material salvo', 'stock');
}
async function borrarInsumo(id){
  if (!(await confirmar('Excluir o material?', 'Ele sai da lista.', 'Excluir', true))) return;
  D().insumos = D().insumos.filter(p => p.id !== id); D().lista = D().lista.filter(x => x.ins !== id);
  guardar(); cerrarModal(); refrescar(); avisar('Material excluído', 'borrar');
}

/* ---------- Lista de compras ---------- */
function totalLista(items){ return items.reduce((s, x) => s + (x.ins && insumo(x.ins) ? insumo(x.ins).costo * x.cant : 0), 0); }
function htmlLista(){
  const items = D().lista, pend = items.filter(x => !x.hecho), hechos = items.filter(x => x.hecho);
  const fila = x => { const p = x.ins ? insumo(x.ins) : null;
    return `<div class="lc-item ${x.hecho ? 'hecho' : ''}">
      <label class="lc-check"><input type="checkbox" ${x.hecho ? 'checked' : ''} onchange="marcarComprado('${x.id}', this.checked)" aria-label="Comprado"></label>
      <div class="lc-txt"><div class="fuerte">${esc(p ? p.nombre : x.nombre)}</div>
        <div class="persona-s">${p ? `Você tem ${p.stock} · mínimo ${p.min}${p.costo ? ' · ' + pesos(p.costo) + ' cada' : ''}` : 'Não está nos seus materiais'}</div></div>
      <div class="contador chico"><button onclick="cantLista('${x.id}',-1)" aria-label="Um a menos">−</button><span>${x.cant}</span><button onclick="cantLista('${x.id}',1)" aria-label="Um a mais">+</button></div>
      <div class="lc-precio num">${p && p.costo ? pesos(p.costo * x.cant) : ''}</div>
      <button class="icon-btn" style="width:30px;height:30px" onclick="quitarDeLista('${x.id}')" aria-label="Tirar da lista">${ico('x')}</button></div>`; };
  return `<div class="caja-info mt" style="margin-bottom:14px">${ico('info')}<div>Toque em <b>Trazer o que falta</b> e os materiais que estão no mínimo entram sozinhos. Enquanto compra, vá marcando; no final, <b>Passar o que comprei para os materiais</b> soma as quantidades e registra a despesa.</div></div>
    <div class="card revelar" style="padding:8px 18px">
      ${pend.length ? pend.map(fila).join('') : `<div class="vacio">${ico('carrito')}A lista está vazia.<div class="mt-s"><button class="btn btn-suave btn-sm" onclick="traerFaltantes()">Trazer o que falta</button></div></div>`}
      ${pend.length ? `<div class="lc-total"><span>Estimado</span><b>${pesos(totalLista(pend))}</b></div>` : ''}
    </div>
    ${hechos.length ? `<div class="card revelar mt" style="padding:8px 18px"><div class="card-cab" style="margin:10px 0 4px"><div class="card-t" style="font-size:19px">Já comprado <span class="card-num">${hechos.length}</span></div></div>
      ${hechos.map(fila).join('')}
      <div class="lc-total"><span>Total</span><b>${pesos(totalLista(hechos))}</b></div>
      <div class="fila" style="justify-content:flex-end;padding:6px 0 12px"><button class="btn btn-oro btn-sm" onclick="pasarComprado()">${ico('ok')} Passar o que comprei para os materiais</button></div></div>` : ''}`;
}
function aLaLista(id){
  const p = insumo(id); if (enLista(id)) return;
  D().lista.push({ id:Store.id('l'), ins:id, nombre:p.nombre, cant:cantidadSugerida(p), hecho:false });
  guardar(); pintarStock(); avisar(p.nombre + ' entrou na lista de compras', 'carrito');
}
function traerFaltantes(){
  const faltan = D().insumos.filter(p => estadoStock(p) !== 'ok' && !enLista(p.id));
  if (!faltan.length) return avisar('Tudo o que falta já está na lista', 'ok');
  faltan.forEach(p => D().lista.push({ id:Store.id('l'), ins:p.id, nombre:p.nombre, cant:cantidadSugerida(p), hecho:false }));
  STK.tab = 'lista'; guardar(); refrescar();
  avisar((faltan.length === 1 ? 'Entrou 1 material' : 'Entraram ' + faltan.length + ' materiais') + ' na lista', 'carrito');
}
function formItemLista(){
  const l = D().insumos.slice().sort((a, b) => a.nombre.localeCompare(b.nombre));
  abrirModal({
    titulo: 'Adicionar à lista', sub: 'Um dos seus materiais, ou algo novo que você precise.',
    cuerpo: `<form class="form" id="f-item" onsubmit="return false">
      ${campo('O quê', sel('ins', [['', 'Outra coisa (vou escrever)']].concat(l.map(p => [p.id, p.nombre + ' · tem ' + p.stock])), '', 'onchange="$(\'#item-otro\').style.display=this.value?\'none\':\'\'"'), { ancho:true })}
      <div id="item-otro" class="ancho">${campo('Nome', inp('nombre', '', 'text', 'placeholder="Ex.: cortador de unhas novo"'))}</div>
      ${campo('Quantidade', inp('cant', 1, 'number', 'min="1"'))}</form>`,
    pie: `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="guardarItemLista()">Adicionar</button>`
  });
}
function guardarItemLista(){
  const v = leerForm($('#f-item'));
  if (!v.ins && !v.nombre) return avisar('Escolha ou escreva o que quer comprar', 'alerta');
  if (v.ins && enLista(v.ins)) return avisar('Isso já está na lista', 'alerta');
  D().lista.push({ id:Store.id('l'), ins:v.ins || null, nombre: v.ins ? insumo(v.ins).nombre : v.nombre, cant:Math.max(1, Number(v.cant) || 1), hecho:false });
  STK.tab = 'lista'; guardar(); cerrarModal(); refrescar(); avisar('Adicionado à lista', 'carrito');
}
const itemLista = id => D().lista.find(x => x.id === id);
function cantLista(id, n){ const x = itemLista(id); x.cant = Math.max(1, x.cant + n); guardar(); refrescar(); }
function marcarComprado(id, v){ itemLista(id).hecho = v; guardar(); refrescar(); }
function quitarDeLista(id){ D().lista = D().lista.filter(x => x.id !== id); guardar(); refrescar(); }
function pasarComprado(){
  const hechos = D().lista.filter(x => x.hecho);
  abrirModal({
    titulo: 'Passar o que comprei', sub: 'As quantidades somam nos seus materiais e a despesa entra no Financeiro do salão.',
    cuerpo: `<form class="form" id="f-pasar" onsubmit="return false">
      <div class="ancho">${hechos.map(x => `<div class="fila-fin" style="padding:5px 0;border-bottom:1px solid var(--borde-2)"><span>${esc(x.nombre)}</span><b>+ ${x.cant}</b></div>`).join('')}</div>
      ${campo('Total que você pagou (R$)', inp('monto', totalLista(hechos), 'number', 'min="0" step="1"'), { ayuda:'Sugerido pelo custo de cada material' })}
      ${campo('Forma de pagamento', sel('medio', MEDIOS_PAGO, 'Pix'))}
      ${campo('Onde comprou (opcional)', inp('prov', '', 'text', 'placeholder="Ex.: Distribuidora Nails Pro"'), { ancho:true })}
      ${campo('Nova validade (opcional)', inp('vence', '', 'date'), { ancho:true, ayuda:'Se comprou algo que vence (géis, top coat…), a data é atualizada.' })}</form>`,
    pie: `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="confirmarPasar()">${ico('ok')} Confirmar</button>`
  });
}
function confirmarPasar(){
  const v = leerForm($('#f-pasar')), hechos = D().lista.filter(x => x.hecho);
  hechos.forEach(x => { if (x.ins && insumo(x.ins)){ moverStock(x.ins, x.cant, 'Compra' + (v.prov ? ' · ' + v.prov : '')); if (v.vence && insumo(x.ins).vence) insumo(x.ins).vence = v.vence; } });
  if (Number(v.monto) > 0) nuevoMov({ tipo:'egr', cat:'Materiais', concepto:'Compra de materiais' + (v.prov ? ' · ' + v.prov : '') + ' (' + hechos.length + ' ' + (hechos.length === 1 ? 'item' : 'itens') + ')', monto:v.monto, medio:v.medio, compra:true });
  D().lista = D().lista.filter(x => !x.hecho);
  guardar(); cerrarModal(); refrescar(); avisar('Compra registrada: somou nos seus materiais' + (Number(v.monto) > 0 ? ' e a despesa de ' + pesos(v.monto) + ' foi registrada' : ''), 'carrito');
}
function compartirLista(){
  const pend = D().lista.filter(x => !x.hecho);
  if (!pend.length) return avisar('A lista está vazia', 'alerta');
  const txt = '🛒 Lista de compras\n' + pend.map(x => '• ' + x.nombre + ' × ' + x.cant).join('\n');
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
  avisar('O WhatsApp abriu com a lista', 'wa');
}

function exportarStock(){
  exportarCSV('Materiais', ['Material','Grupo','Tenho','Mínimo','Custo por unidade','Validade','Status','Na lista de compras'],
    D().insumos.map(p => [p.nombre, p.cat, p.stock, p.min, p.costo, fCorta(p.vence), ESTADOS_STOCK[estadoStock(p)].t, enLista(p.id) ? 'Sim' : 'Não']));
}

  const c = D().config;
  encabezado('Configurações', 'Ajustes gerais da página. As mudanças valem na hora.', '');

    <div class="card revelar"><div class="card-cab"><div class="card-t">Suas regras</div></div>
      <form class="form" id="cf-datos" onsubmit="return false">
        ${campo('Nome para a saudação', inp('duena', c.duena), { ancho:true, ayuda:'Aparece na tela de entrada e em «Hoje».' })}
        ${campo('Manutenção a cada (dias)', inp('diasMant', c.diasMant, 'number', 'min="7" max="60"'), { ayuda:'Para avisar quem está na hora.' })}
        ${campo('Garantia (dias)', inp('diasGarantia', c.diasGarantia, 'number', 'min="0" max="30"'), { ayuda:'Reparos sem custo.' })}
        ${campo('Sinal para aplicações (R$)', inp('senaColocacion', c.senaColocacion, 'number', 'min="0" step="5"'))}
        ${campo('Cliente inativa depois de (dias)', inp('diasInactiva', c.diasInactiva, 'number', 'min="30"'))}
      </form><div class="fila mt"><button class="btn btn-oro btn-sm" onclick="guardarConfigDatos()">Salvar</button></div></div>

    <div class="card revelar"><div class="card-cab"><div class="card-t">Horário de atendimento</div></div>
      <form class="form" id="cf-horario" onsubmit="return false">
        <div class="ancho fila">${[1,2,3,4,5,6,0].map(d => `<label class="pildora" style="cursor:pointer"><input type="checkbox" name="d${d}" ${c.horario.dias.includes(d) ? 'checked' : ''} style="accent-color:var(--oro)"> ${DIAS_C[d]}</label>`).join('')}</div>
        ${campo('Das', inp('desde', c.horario.desde, 'time', 'step="1800"'))}${campo('Até', inp('hasta', c.horario.hasta, 'time', 'step="1800"'))}
      </form>
      <div class="caja-info mt">${ico('info')}<div>A agenda avisa se um horário fica fora deste horário ou coincide com outro (e deixa salvar mesmo assim).</div></div>
      <div class="fila mt"><button class="btn btn-oro btn-sm" onclick="guardarConfigHorario()">Salvar</button></div></div>

    <div class="card revelar" style="grid-column:1/-1"><div class="card-cab"><div class="card-t">Mensagens de WhatsApp<small>Você pode usar {nome}, {servico}, {dia}, {hora}, {dias} e {sinal}: se completam sozinhos.</small></div></div>
      <form class="form" id="cf-mensajes" onsubmit="return false">
        ${campo('Lembrete de horário', area('turno', c.mensajes.turno))}${campo('Hora da manutenção', area('mant', c.mensajes.mant))}
        ${campo('Pedido de sinal', area('sena', c.mensajes.sena))}${campo('Parabéns de aniversário', area('cumple', c.mensajes.cumple))}
        ${campo('Convite para voltar', area('volver', c.mensajes.volver), { ancho:true })}
      </form><div class="fila mt"><button class="btn btn-oro btn-sm" onclick="guardarConfigMensajes()">Salvar mensagens</button>
        <button class="btn btn-linea btn-sm" onclick="restaurarMensajes()">Voltar aos textos originais</button></div></div>

    <div class="card revelar" style="grid-column:1/-1"><div class="card-cab"><div class="card-t">Sobre esta demonstração</div></div>
      <div class="caja-info">${ico('info')}<div>É uma <b>demonstração</b>: todos os dados são inventados e o que você cadastrar fica salvo só neste navegador.
        Na sua versão, os dados ficam na nuvem e você entra com seu e-mail e uma senha que você mesma cria.</div></div>
      <div class="lat-wydan" style="justify-content:flex-start;margin-top:16px;font-size:12px"><img src="${LOGO_WYDAN_ICONO}" alt="" style="width:28px;height:28px"><span>Desenvolvido por <b>WYDAN</b> Solutions · wydan.solutions@gmail.com</span></div></div>
  </div>`;
};
function guardarConfigDatos(){
  const v = leerForm($('#cf-datos')), c = D().config;
  c.duena = v.duena || c.duena;
  ['diasMant','diasGarantia','senaColocacion','diasInactiva'].forEach(k => { if (v[k] !== '' && Number(v[k]) >= 0) c[k] = Number(v[k]); });
  guardar(); refrescar(); avisar('Salvo', 'config');
}
function guardarConfigHorario(){
  const v = leerForm($('#cf-horario'));
  const dias = [0,1,2,3,4,5,6].filter(d => v['d' + d]);
  if (!dias.length) return avisar('Marque pelo menos um dia', 'alerta');
  if (minutos(v.hasta) <= minutos(v.desde)) return avisar('O horário de fechamento tem que ser depois do de abertura', 'alerta');
  D().config.horario = { dias, desde:v.desde, hasta:v.hasta }; guardar(); avisar('Horário salvo', 'reloj');
}

   previa y se descarga o se comparte (en el celular, directo a WhatsApp).

const CARTA = { cats:null, duracion:true, condiciones:true, nota:'Consulte decorações especiais: cada set é único 💅' };
const CARTA_ANCHO = 794, CARTA_ALTO = 1123;   // A4 a 96 puntos por pulgada
const CARTA_TEXTO = {
  'Alongamento': 'Gel moldado, polygel, fibra ou soft gel. Formato e comprimento à sua escolha.',
  'Manutenção': 'Preenchimento, nivelamento e esmaltação. Ideal a cada 3 semanas.',
  'Remoção e reparos': 'Remoção cuidando da sua unha natural.',
  'Esmaltação': 'Sobre a sua unha natural.',
  'Decoração': 'Para somar a qualquer serviço.'
};
const LIBS_PDF = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
                  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];

function durTexto(m){ const h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r + ' min' : '') : r + ' min'; }
function serviciosCarta(){ return D().servicios.filter(s => s.activo); }
function catsDisponibles(){ return CATEGORIAS_SERVICIO.filter(c => serviciosCarta().some(s => s.cat === c)); }

/* ---------- La hoja ---------- */
function cartaHtml(){
  const cf = D().config, ct = cf.contacto || {}, h = aFecha(hoy());
  const cats = catsDisponibles().filter(c => CARTA.cats.includes(c));
  const bloques = cats.map(c => `<div class="carta-cat"><div class="carta-cat-t">${esc(c)}</div>
      ${CARTA_TEXTO[c] ? `<div class="carta-cat-s">${esc(CARTA_TEXTO[c])}</div>` : ''}
      ${serviciosCarta().filter(s => s.cat === c).map(s => `<div class="carta-fila">
        <div class="carta-n">${esc(s.nombre)}${CARTA.duracion ? `<small>${durTexto(s.dur)}</small>` : ''}</div>
        <span class="carta-linea"></span><div class="carta-p">${pesos(s.precio)}</div></div>`).join('')}</div>`).join('');
  const conds = CARTA.condiciones ? [
    ['Manutenção', 'A cada ' + cf.diasMant + ' dias. Depois de 4 semanas, é manutenção fora do prazo.'],
    ['Garantia', 'Se uma unha quebrar em até ' + cf.diasGarantia + ' dias, o reparo não tem custo.'],
    ['Reserva', 'As aplicações são confirmadas com um sinal de ' + pesos(cf.senaColocacion) + ', descontado do total.']
  ] : [];
  const contacto = [ct.whatsapp && ['WhatsApp', ct.whatsapp], ct.instagram && ['Instagram', ct.instagram], ct.direccion && ['Onde', ct.direccion]].filter(Boolean);
  return `<div class="carta">
    <div class="carta-rama izq">${ramaCarta()}</div><div class="carta-rama der">${ramaCarta()}</div>
    <div class="carta-marco">
      <img class="carta-logo" src="${LOGO_EH}" alt="">
      <div class="carta-tit">Serviços e preços</div>
      <div class="carta-sub">Preços válidos · ${MESES[h.getMonth()]} de ${h.getFullYear()}</div>
      <div class="carta-cols">${bloques || '<div class="carta-cat-s">Escolha pelo menos um grupo de serviços.</div>'}</div>
      ${conds.length ? `<div class="carta-cond"><div class="carta-cond-t">Bom saber</div>
        ${conds.map(([t, x]) => `<div class="carta-cond-i"><b>${t}</b><span>${esc(x)}</span></div>`).join('')}</div>` : ''}
      ${CARTA.nota ? `<div class="carta-nota">${esc(CARTA.nota)}</div>` : ''}
      <div class="carta-pie"><div class="carta-pie-t">Agende seu horário</div>
        ${contacto.length ? `<div class="carta-contacto">${contacto.map(([l, v]) => `<span><small>${l}</small>${esc(v)}</span>`).join('')}</div>` : '<div class="carta-contacto"><span>pelo WhatsApp ou Instagram</span></div>'}</div>
    </div></div>`;
}
// Rama fina, como las del logo (en las esquinas de la hoja)
function ramaCarta(){
  let h = '<svg viewBox="0 0 160 220" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#C99A8C" stroke-width="1.3" stroke-linecap="round"><path d="M20 210C40 150 70 90 140 15"/>';
  for (let i = 1; i <= 7; i++){
    const t = i / 8, x = 20 + 120 * t + 8 * Math.sin(t * 3), y = 210 - 195 * t, lado = i % 2 ? 1 : -1;
    h += `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${lado * 60 - 45})" d="M0 0C8 -7 24 -8 36 0C24 8 8 7 0 0Z"/>`;
  }
  return h + '</g></svg>';
}

/* ---------- Vista previa con opciones ---------- */
function abrirCarta(){

  const ct = D().config.contacto || {};
  abrirModal({

}
function actualizarCarta(){
  const f = $('#f-carta'); if (!f) return;
  const v = leerForm(f);
  CARTA.cats = catsDisponibles().filter(c => v['cat_' + c]);
  $$('.carta-op .pildora').forEach(p => p.classList.toggle('on', p.querySelector('input').checked));
  CARTA.duracion = v.duracion; CARTA.condiciones = v.condiciones; CARTA.nota = v.nota;
  D().config.contacto = { whatsapp:v.whatsapp, instagram:v.instagram, direccion:v.direccion }; guardar();
  $('#carta-escala').innerHTML = cartaHtml(); escalarCarta();

// La hoja mide siempre 794 px: en la vista previa se achica para que entre
function escalarCarta(){
  const cont = $('#carta-prev'), esc2 = $('#carta-escala'); if (!cont || !esc2) return;
  const k = cont.clientWidth / CARTA_ANCHO, alto = Math.max(CARTA_ALTO, esc2.firstElementChild.scrollHeight);
  esc2.style.transform = 'scale(' + k + ')'; cont.style.height = Math.ceil(alto * k) + 'px';
}
window.addEventListener('resize', () => { if ($('#carta-prev')) escalarCarta(); });

/* ---------- Generar el PDF ---------- */
function cargarScript(src){
  return new Promise((ok, mal) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s);
  });
}
async function pdfCarta(compartir){
  if (!CARTA.cats.length) return avisar('Escolha pelo menos um grupo de serviços', 'alerta');
  const nombre = 'Eduarda Hoffmann - Servicos e precos.pdf';
  avisar('Montando o PDF…', 'descargar');
  // La hoja se dibuja a tamaño real, fuera de la pantalla, y se fotografía en alta calidad
  const caja = document.createElement('div');
  caja.className = 'carta-render'; caja.innerHTML = cartaHtml(); document.body.appendChild(caja);
  try {
    for (const s of LIBS_PDF) await cargarScript(s);
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const hoja = caja.firstElementChild;
    const lienzo = await html2canvas(hoja, { scale:2, backgroundColor:'#FBF5F2', useCORS:true, logging:false, width:CARTA_ANCHO, windowWidth:CARTA_ANCHO });
    const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4', orientation:'portrait', compress:true });
    const altoPag = Math.round(lienzo.width * 297 / 210);
    // Si se pasa un poco de la hoja, se achica para que entre entera en una sola página
    if (lienzo.height <= altoPag * 1.3){
      const ancho = 210 * Math.min(1, altoPag / lienzo.height);
      pdf.setFillColor(251, 245, 242); pdf.rect(0, 0, 210, 297, 'F');
      pdf.addImage(lienzo.toDataURL('image/jpeg', .92), 'JPEG', (210 - ancho) / 2, 0, ancho, ancho * lienzo.height / lienzo.width);
    }
    // Si la lista es muy larga, sigue en otra hoja
    else for (let y = 0, pag = 0; y < lienzo.height; y += altoPag, pag++){
      const trozo = document.createElement('canvas');
      trozo.width = lienzo.width; trozo.height = Math.min(altoPag, lienzo.height - y);
      const ctx = trozo.getContext('2d'); ctx.fillStyle = '#FBF5F2'; ctx.fillRect(0, 0, trozo.width, trozo.height);
      ctx.drawImage(lienzo, 0, y, lienzo.width, trozo.height, 0, 0, lienzo.width, trozo.height);
      if (pag) pdf.addPage();
      pdf.addImage(trozo.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, 210, trozo.height * 210 / lienzo.width);
    }
    const blob = pdf.output('blob'), archivo = new File([blob], nombre, { type:'application/pdf' });
    if (compartir && navigator.canShare && navigator.canShare({ files:[archivo] })){
      try { await navigator.share({ files:[archivo], title:'Serviços e preços', text:'Oi! Segue a minha tabela de serviços e preços 💅' }); avisar('Tabela enviada', 'wa'); }
      catch (e) { if (e.name !== 'AbortError') throw e; }
    } else {
      pdf.save(nombre);
      avisar(compartir ? 'O PDF foi baixado: anexe no WhatsApp a partir dos Downloads' : 'A tabela de preços em PDF foi baixada', 'descargar');
    }
  } catch (e) {
    // Sin internet no se pueden cargar las herramientas del PDF: se usa la impresión del navegador
    $('#impresion').innerHTML = cartaHtml();
    avisar('Escolha «Salvar como PDF» na janela de impressão', 'imprimir');
    setTimeout(() => window.print(), 300);
  } finally { caja.remove(); }
}

/* =====================================================================

const PS = { vista:'mes', fecha:null, tipo:'', lim:50 };

function rangoPs(){ const f = PS.fecha; if (PS.vista === 'mes') return [inicioMes(f), finMes(f)]; const y = f.slice(0, 4); return [y + '-01-01', y + '-12-31']; }
function etiquetaPs(){ const d = aFecha(PS.fecha); return PS.vista === 'mes' ? MESES[d.getMonth()] + ' de ' + d.getFullYear() : String(d.getFullYear()); }
function moverPs(n){ PS.fecha = PS.vista === 'mes' ? sumarMeses(PS.fecha, n) : sumarMeses(PS.fecha, 12 * n); PS.lim = 50; RENDER.pessoal(); }
const pessoal = () => D().pessoal || (D().pessoal = []);
const sumaPs = (l, tipo) => l.reduce((s, p) => s + (p.tipo === tipo ? p.monto : 0), 0);

RENDER.pessoal = function(){
  if (!PS.fecha) PS.fecha = hoy();
  encabezado('Finanças pessoais', 'O que você tira do salão para você e os seus gastos pessoais, separados das contas do salão.',
    btnExportar('exportarPessoal') +
    `<button class="btn btn-linea" onclick="formPessoal('ret')">${ico('dinero')} Registrar retirada</button>
     <button class="btn btn-oro" onclick="formPessoal('gasto')">${ico('mas')} Registrar gasto pessoal</button>`);
  const [a, b] = rangoPs();
  const enRango = pessoal().filter(p => p.fecha >= a && p.fecha <= b);
  const ret = sumaPs(enRango, 'ret'), gas = sumaPs(enRango, 'gasto'), sobra = ret - gas;
  const movSalon = D().movs.filter(m => m.fecha >= a && m.fecha <= b);
  const lucro = sumaMovs(movSalon, 'ing') - sumaMovs(movSalon, 'egr');
  // Gastos por categoría
  const porCat = {};
  enRango.filter(p => p.tipo === 'gasto').forEach(p => porCat[p.cat] = (porCat[p.cat] || 0) + p.monto);
  const cats = Object.keys(porCat).sort((x, y) => porCat[y] - porCat[x]), maxCat = cats.length ? porCat[cats[0]] : 1;
  const barra = (t, v, max) => `<div class="barra-h"><div class="fila-fin"><span>${t}</span><span class="num fuerte">${pesos(v)} <span class="muted" style="font-weight:500">· ${gas ? pct(v / gas * 100) : '—'}</span></span></div>
    <div class="avance"><span style="width:${Math.max(2, v / max * 100)}%;background:#C9A096"></span></div></div>`;

  $('#vista').innerHTML = `<div class="ag-herr">
      <div class="fila"><div class="segmento">${[['mes','Mês'],['anio','Ano']].map(([k, t]) => `<button class="${PS.vista === k ? 'on' : ''}" onclick="PS.vista='${k}'; RENDER.pessoal()">${t}</button>`).join('')}</div>
        <div class="navfecha"><button class="icon-btn" onclick="moverPs(-1)" aria-label="Anterior">${ico('izq')}</button><span class="lbl">${etiquetaPs()}</span>
          <button class="icon-btn" onclick="moverPs(1)" aria-label="Próximo">${ico('der')}</button></div>
        <button class="btn btn-linea btn-sm" onclick="PS.fecha=hoy(); RENDER.pessoal()">Hoje</button></div></div>
    <div class="grid g-4 revelar">
      <div class="kpi"><div class="kpi-l">${ico('dinero')} Retiradas do salão</div><div class="kpi-v pos">${pesos(ret)}</div><div class="kpi-d">${(n => n + (n === 1 ? ' retirada' : ' retiradas'))(enRango.filter(p => p.tipo === 'ret').length)}</div></div>
      <div class="kpi"><div class="kpi-l">${ico('carteira')} Gastos pessoais</div><div class="kpi-v">${pesos(gas)}</div><div class="kpi-d">${(n => n + (n === 1 ? ' gasto' : ' gastos'))(enRango.filter(p => p.tipo === 'gasto').length)}</div></div>
      <div class="kpi ${sobra < 0 ? 'alerta' : ''}"><div class="kpi-l">${ico('finanzas')} Sobrou para você</div><div class="kpi-v ${sobra >= 0 ? 'pos' : ''}">${pesos(sobra)}</div><div class="kpi-d">${sobra >= 0 ? 'retiradas menos gastos' : 'você gastou mais do que retirou'}</div></div>
      <div class="kpi" style="cursor:pointer" onclick="ir('cobros')"><div class="kpi-l">${ico('estrella')} Lucro do salão</div><div class="kpi-v">${pesos(lucro)}</div><div class="kpi-d">${lucro > 0 ? 'você retirou ' + pct(ret / lucro * 100) : 'no período'}</div></div>
    </div>
    <div class="grid mt" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)" id="ps-g1">
      <div class="card revelar"><div class="card-cab"><div class="card-t">Retiradas vs. gastos pessoais<small>${PS.vista === 'anio' ? 'Mês a mês, ' + PS.fecha.slice(0, 4) : 'Últimos 6 meses'}</small></div>
        <div class="graf-ley"><span><i style="background:var(--oro)"></i>Retiradas</span><span><i style="background:#DCD3C9"></i>Gastos</span></div></div>${graficoPs()}</div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Gastos por categoria<small>${etiquetaPs()}</small></div></div>
        ${cats.length ? cats.map(c => barra(esc(c), porCat[c], maxCat)).join('') : '<div class="vacio">Nenhum gasto pessoal neste período.</div>'}</div>
    </div>
    <div class="card-cab mt" style="margin-top:28px"><div class="card-t">Movimentos pessoais <span class="card-num">${enRango.length}</span></div>
      <select class="sel" onchange="PS.tipo=this.value; pintarPs()"><option value="">Retiradas e gastos</option><option value="ret" ${PS.tipo === 'ret' ? 'selected' : ''}>Só retiradas</option><option value="gasto" ${PS.tipo === 'gasto' ? 'selected' : ''}>Só gastos</option></select></div>
    <div class="tabla-caja" id="ps-movs"></div>`;

function psFiltrados(){
  const [a, b] = rangoPs();
  return pessoal().filter(p => p.fecha >= a && p.fecha <= b && (!PS.tipo || p.tipo === PS.tipo)).sort((x, y) => y.fecha.localeCompare(x.fecha));
}
function pintarPs(){
  const lista = psFiltrados();
  $('#ps-movs').innerHTML = lista.length ? `<div class="tabla-scroll"><table class="tabla tabla-movs"><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Forma</th><th class="derecha">Valor</th></tr></thead><tbody>
    ${lista.slice(0, PS.lim).map(p => `<tr class="clic" onclick="formPessoal('${p.tipo}','${p.id}')">
      <td class="num" style="white-space:nowrap">${fCorta(p.fecha)}</td>
      <td><div class="fuerte">${esc(p.concepto)}</div></td>
      <td><span class="chip ${p.tipo === 'ret' ? 'c-ok' : 'c-gris'} sin-punto">${p.tipo === 'ret' ? 'Retirada' : esc(p.cat)}</span></td>
      <td class="t2">${esc(p.medio)}</td>
      <td class="derecha num fuerte ${p.tipo === 'ret' ? 'pos' : 'neg'}" style="white-space:nowrap">${p.tipo === 'ret' ? '+' : '−'} ${pesos(p.monto)}</td></tr>`).join('')}
    </tbody></table></div>${lista.length > PS.lim ? `<div class="mas-filas"><button class="btn btn-linea btn-sm" onclick="PS.lim+=50; pintarPs()">Ver mais (${lista.length - PS.lim})</button></div>` : ''}`
    : `<div class="vacio">${ico('carteira')}Nenhum movimento pessoal neste período.</div>`;
}
// Gráfico de barras: retiradas y gastos por mes (SVG, sin librerías)
function graficoPs(){
  let meses = [];
  if (PS.vista === 'anio'){ const y = PS.fecha.slice(0, 4); for (let m = 1; m <= 12; m++) meses.push(y + '-' + p2(m)); }
  else for (let k = 5; k >= 0; k--) meses.push(mesClave(sumarMeses(PS.fecha, -k)));
  const datos = meses.map(mk => { const l = pessoal().filter(p => mesClave(p.fecha) === mk); return { mk, ret:sumaPs(l, 'ret'), gas:sumaPs(l, 'gasto') }; });
  const max = Math.max(1, ...datos.map(x => Math.max(x.ret, x.gas))) * 1.12;
  const W = 640, H = 240, izq = 54, abajo = 26, arr = 10, ancho = (W - izq - 6) / datos.length, bw = Math.min(26, ancho * .3);
  const y = v => arr + (H - arr - abajo) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = max / 1.12 * i / 4; g += `<line x1="${izq}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#F0E9E1"/><text x="${izq - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toFixed(1).replace('.', ',').replace(',0', '') + ' mil' : Math.round(v)}</text>`; }
  datos.forEach((x, i) => {
    const cx = izq + ancho * i + ancho / 2, d = aFecha(x.mk + '-01');
    g += `<g class="mes"><title>${MESES[d.getMonth()]}: retiradas ${pesos(x.ret)} · gastos ${pesos(x.gas)} · sobrou ${pesos(x.ret - x.gas)}</title>
      <rect class="b-ing" x="${cx - bw - 2}" y="${y(x.ret)}" width="${bw}" height="${Math.max(0, H - abajo - y(x.ret))}" rx="4"/>
      <rect class="b-egr" x="${cx + 2}" y="${y(x.gas)}" width="${bw}" height="${Math.max(0, H - abajo - y(x.gas))}" rx="4"/>
      <text x="${cx}" y="${H - 8}" text-anchor="middle" ${x.mk === mesClave(PS.fecha) ? 'style="fill:var(--grafito);font-weight:700"' : ''}>${MESES_C[d.getMonth()]}</text></g>`;
  });
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de retiradas e gastos pessoais por mês">
    <defs><linearGradient id="gradOro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4A58C"/><stop offset="1" stop-color="#A8705A"/></linearGradient></defs>${g}</svg>`;
}

/* ---------- Registrar y editar ---------- */
function formPessoal(tipo, id){
  const p = id ? pessoal().find(x => x.id === id) : { tipo, fecha:hoy(), cat: tipo === 'gasto' ? 'Mercado' : '', concepto: tipo === 'ret' ? 'Retirada do salão' : '', monto:'', medio:'Pix' };
  const esRet = p.tipo === 'ret';
  abrirModal({
    titulo: id ? (esRet ? 'Editar retirada' : 'Editar gasto pessoal') : (esRet ? 'Registrar retirada' : 'Registrar gasto pessoal'),
    sub: esRet ? 'O dinheiro que você tira do salão para você. Não conta como despesa do salão.' : 'Seus gastos de casa, mercado, saúde… ficam separados das contas do salão.',
    cuerpo: `<form class="form" id="f-ps" onsubmit="return false">
      ${campo('Descrição', inp('concepto', p.concepto, 'text', `placeholder="${esRet ? 'Ex.: retirada da quinzena' : 'Ex.: mercado do mês'}"`), { ancho:true })}
      ${campo('Valor (R$)', inp('monto', p.monto, 'number', 'min="0" step="5"'))}
      ${campo('Data', inp('fecha', p.fecha, 'date'))}
      ${esRet ? '' : campo('Categoria', sel('cat', CAT_PESSOAL, p.cat))}
      ${campo('Forma', sel('medio', MEDIOS_PAGO, p.medio), { ancho: esRet })}
    </form>`,
    pie: (id ? `<button class="btn btn-peligro izq" onclick="borrarPessoal('${id}')">${ico('borrar')} Excluir</button>` : '') +
      `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="guardarPessoal('${p.tipo}','${id || ''}')">Salvar</button>`
  });
}
function guardarPessoal(tipo, id){
  const v = leerForm($('#f-ps'));
  if (!v.concepto) return avisar('Escreva a descrição', 'alerta');
  if (!(v.monto > 0)) return avisar('Informe o valor', 'alerta');
  const datos = { tipo, fecha:v.fecha || hoy(), cat: tipo === 'ret' ? '' : v.cat, concepto:v.concepto, monto:Number(v.monto), medio:v.medio };
  if (id) Object.assign(pessoal().find(x => x.id === id), datos); else pessoal().push(Object.assign({ id:Store.id('p') }, datos));
  guardar(); cerrarModal(); refrescar(); avisar(tipo === 'ret' ? 'Retirada registrada' : 'Gasto pessoal registrado', tipo === 'ret' ? 'dinero' : 'carteira');
}
async function borrarPessoal(id){
  if (!(await confirmar('Excluir o movimento?', 'Ele sai das Finanças pessoais.', 'Excluir', true))) return;
  D().pessoal = pessoal().filter(x => x.id !== id); guardar(); cerrarModal(); refrescar(); avisar('Movimento excluído', 'borrar');
}
function exportarPessoal(){
  exportarCSV('Financas pessoais ' + etiquetaPs(), ['Data','Tipo','Categoria','Descrição','Forma','Valor'],
    psFiltrados().map(p => [fCorta(p.fecha), p.tipo === 'ret' ? 'Retirada' : 'Gasto', p.cat, p.concepto, p.medio, (p.tipo === 'ret' ? 1 : -1) * p.monto]));
}

function abrirApp(){
  const app = $('#app');
  app.classList.remove('hidden'); app.classList.add('entrando');
  setTimeout(() => app.classList.remove('entrando'), 800);
  ir(location.hash.slice(1) || 'hoy', true);
}
window.addEventListener('hashchange', () => { if (!$('#app').classList.contains('hidden')) ir(location.hash.slice(1), true); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#dialogo').classList.contains('hidden')) $('#dlg-no').click();
  else if (modalAbierto()) cerrarModal();
  else cerrarMenu();
});
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') cerrarModal(); });
window.addEventListener('afterprint', () => { $('#impresion').innerHTML = ''; });

Store.cargar();
armarLateral();
// Desde la página comercial de Wydan (link con ?web=1) se entra directo al bloqueo, sin la presentación.

const DESDE_WEB = new URLSearchParams(location.search).has("web");
if (DESDE_WEB){ document.body.classList.add("modo-web"); mostrarBloqueo(); } else mostrarBienvenida();
