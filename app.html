    if (t.estado === 'realizado'){ s.visitas++; if (!s.ultima || t.fecha > s.ultima) s.ultima = t.fecha; }
    else if (turnoActivo(t) && t.fecha >= h){ if (!s.proximo || (t.fecha + t.hora) < (s.proximo.fecha + s.proximo.hora)) s.proximo = t; }
  });
  D().movs.forEach(mv => { if (mv.tipo === 'ing' && mv.cli && m[mv.cli]) m[mv.cli].total += mv.monto; });
  return m;
}
function esInactiva(st){ return !st.proximo && (!st.ultima || difDias(st.ultima, hoy()) > D().config.diasInactiva); }

/* ---------- Mantenimiento de las extensiones ----------
   Cuenta desde la última colocación o mantenimiento realizado. Si después hubo un retiro,
   la clienta queda «sin extensiones». Si ya tiene un turno de mantenimiento agendado, se marca. */
function infoMant(cid){
  const h = hoy(), dias = D().config.diasMant;
  const hechos = D().turnos.filter(t => t.cli === cid && t.estado === 'realizado' && servicio(t.serv) && servicio(t.serv).ciclo)
    .sort(ordenTurno);
  const ult = hechos[hechos.length - 1];
  if (!ult || servicio(ult.serv).ciclo === 'retiro') return { estado:'sin', ultima: ult ? ult.fecha : null, turno: ult || null };
  const proximo = sumarDias(ult.fecha, dias), faltan = difDias(h, proximo), desde = difDias(ult.fecha, h);
  const agendado = D().turnos.filter(t => t.cli === cid && turnoActivo(t) && t.estado !== 'realizado' && t.fecha >= h &&
    servicio(t.serv) && servicio(t.serv).ciclo).sort(ordenTurno)[0] || null;
  let estado = faltan > 3 ? 'aldia' : faltan > 0 ? 'pronto' : faltan >= -7 ? 'toca' : 'atrasada';
  if (agendado) estado = 'agendada';
  return { estado, ultima:ult.fecha, turno:ult, proximo, faltan, desde, agendado };
}
function chipMant(i){
  const x = ESTADOS_MANT[i.estado];
  let extra = '';
  if (i.estado === 'pronto') extra = ' · ' + cuando(i.proximo);
  if (i.estado === 'toca') extra = i.faltan === 0 ? ' · hoje' : ' · há ' + (-i.faltan) + ' d';
  if (i.estado === 'atrasada') extra = ' · ' + (-i.faltan) + ' d';

  return `<span class="chip ${x.c}">${x.t}${extra}</span>`;
}
// Garantía: si una uña se rompe a pocos días de la colocación o el mantenimiento, la reparación no se cobra.
function garantiaVigente(cid, fecha){
  const i = infoMant(cid);
  if (!i.turno || i.estado === 'sin') return null;
  const d = difDias(i.turno.fecha, fecha || hoy());

}

const ordenTurno = (a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora);

function superposicion(t){
  const a = minutos(t.hora), b = a + Number(t.dur);
  return D().turnos.find(o => o.id !== t.id && o.fecha === t.fecha && turnoActivo(o) && minutos(o.hora) < b && finTurno(o) > a);

function enLista(insId){ return (D().lista || []).find(x => x.ins === insId && !x.hecho); }

    const ult = d.turnos.filter(t => t.cli === c.id && t.estado === 'realizado').sort(ordenTurno).slice(-2)[0];
    if (!ult) return;
    const f = habil(sumarDias(ult.fecha, k < 2 ? 3 : 9), 1);
    if (f < h) agregarTurno(c, 's7', f, k < 2 ? { precio:0, nota:'Na garantia' } : null);
  });

  // El resto de la semana: al menos dos turnos por día (clientas al día que ya reservaron, y esmaltados)
  const conFuturo = new Set(d.turnos.filter(t => t.fecha > h).map(t => t.cli));
  for (let k = 2; k <= 7; k++){
    const dd = sumarDias(h, k); if (!abierto(dd)) continue;
    let cuantos = d.turnos.filter(t => t.fecha === dd).length;
    const libres = d.clientes.filter(c => !conFuturo.has(c.id) && (c.perfil === 'esm' || (c.perfil === 'aldia' && infoMantEjemplo(d, c.id) >= 10)));
    while (cuantos < 2 && libres.length){
      const c = libres.shift(); conFuturo.add(c.id);
      if (agregarTurno(c, c.perfil === 'esm' ? 's8' : 's4', dd, { estado:'confirmado', rec:false })) cuantos++;
    }
  }

  /* ---------- Materiales (el último número: en cuántos días vence; null = no vence) ---------- */
  [['Gel construtor rosa (50 g)','Géis e polygel',3,2,95,240],['Gel construtor transparente (50 g)','Géis e polygel',1,2,95,190],
   ['Polygel nude (30 g)','Géis e polygel',4,2,60,300],['Base rubber','Géis e polygel',2,1,45,45],['Top coat brilho','Géis e polygel',1,2,40,160],['Top coat fosco','Géis e polygel',2,1,40,22],
   ['Tips amendoadas (caixa c/ 500)','Tips e moldes',2,1,55,null],['Moldes adesivos (rolo c/ 300)','Tips e moldes',2,1,30,null],
   ['Primer sem ácido','Preparação',3,1,35,-6],['Desidratador','Preparação',2,1,30,210],['Álcool isopropílico (1 L)','Preparação',2,1,28,400],
   ['Esmaltes em gel (frascos)','Esmaltes',38,15,25,120],['Óleo de cutículas','Preparação',4,2,15,280],
   ['Lixas 100/180 (unidades)','Lixas e polimento',42,20,2,null],['Blocos polidores','Lixas e polimento',12,10,3,null],['Brocas para lixadeira','Lixas e polimento',6,4,20,null],
   ['Pedrarias e strass (mix)','Decoração',3,1,25,null],['Foil e adesivos','Decoração',6,2,8,null],
   ['Luvas de nitrilo (caixa c/ 100)','Descartáveis',0,1,35,null],['Lenços sem fiapos (c/ 500)','Descartáveis',2,1,20,null],['Máscaras (caixa c/ 50)','Descartáveis',3,1,15,null]]
    .forEach(([nombre, cat, stock, min, costo, vence]) => d.insumos.push({ id:id('i'), nombre, cat, stock, min, costo, vence: vence == null ? '' : sumarDias(h, vence) }));
  // Lista de compras arrancada (lo demás se trae con «Trazer o que falta»)
  d.lista = [
    { id:id('l'), ins:d.insumos.find(x => x.nombre.startsWith('Primer')).id, nombre:'Primer sem ácido', cant:1, hecho:false },
    { id:id('l'), ins:null, nombre:'Cortador de unhas novo', cant:1, hecho:false }
  ];

  /* ---------- Gastos del salón de los últimos 7 meses ---------- */
  const PROVS = ['Distribuidora Nails Pro', 'Bella Unha Materiais', 'Glam Store Livramento'];
  for (let k = 6; k >= 0; k--){
    const mes = sumarMeses(inicioMes(h), -k), y = mes.slice(0, 8);
    const gasto = (dia, cat, concepto, monto, medio) => { const f = y + p2(dia); if (f <= h) d.movs.push({ id:id('m'), fecha:f, tipo:'egr', cat, concepto, monto, medio:medio || 'Pix' }); };
    gasto(10, 'Aluguel', 'Aluguel da sala', 900);
    gasto(10, 'Contas (luz, água, internet)', 'Conta de luz', entre(150, 230));
    gasto(12, 'Contas (luz, água, internet)', 'Internet', 100);
    gasto(20, 'Impostos (MEI/DAS)', 'DAS do MEI', 80);
    gasto(20, 'Publicidade', 'Anúncios no Instagram', elegir([80, 100, 120]), 'Crédito');
    gasto(entre(3, 8), 'Materiais', 'Compra de materiais · ' + elegir(PROVS), entre(18, 46) * 10);
    gasto(entre(17, 26), 'Materiais', 'Compra de materiais · ' + elegir(PROVS), entre(14, 38) * 10);
    if (k === 3) gasto(9, 'Cursos', 'Curso de nail art avançado', 450);
  }
  // Movimientos de materiales (compras y cantidades actualizadas)
  const ins = nom => d.insumos.find(x => x.nombre.startsWith(nom));
  [[-24,'Gel construtor rosa',3,'Compra'],[-24,'Top coat brilho',2,'Compra'],[-16,'Luvas de nitrilo',-1,'Quantidade atualizada'],[-12,'Gel construtor transparente',-1,'Quantidade atualizada'],
   [-9,'Lixas 100/180',-8,'Quantidade atualizada'],[-6,'Polygel nude',2,'Compra'],[-4,'Luvas de nitrilo',-1,'Quantidade atualizada'],[-2,'Top coat brilho',-1,'Quantidade atualizada']]
    .forEach(([dd, nom, cant, motivo]) => d.ajustes.push({ id:id('aj'), fecha:sumarDias(h, dd), ins:ins(nom).id, cant, motivo }));

  /* ---------- Finanças pessoais: retiradas del salón y gastos de Eduarda ---------- */
  for (let k = 6; k >= 0; k--){
    const y = sumarMeses(inicioMes(h), -k).slice(0, 8);
    const ps = (dia, tipo, cat, concepto, monto) => { const f = y + p2(dia); if (f <= h) d.pessoal.push({ id:id('p'), fecha:f, tipo, cat, concepto, monto, medio:'Pix' }); };
    ps(1, 'ret', '', 'Retirada da quinzena', elegir([1800, 2000, 2200]));
    ps(15, 'ret', '', 'Retirada da quinzena', elegir([1800, 2000, 2200]));
    ps(8, 'gasto', 'Casa', 'Aluguel de casa', 850);
    ps(12, 'gasto', 'Casa', 'Luz e água de casa', entre(11, 18) * 10);
    [3, 10, 17, 24].forEach(dia => ps(dia, 'gasto', 'Mercado', 'Mercado', entre(18, 35) * 10));
    ps(6, 'gasto', 'Saúde', 'Plano de saúde', 260);
    ps(14, 'gasto', 'Saúde', 'Farmácia', entre(4, 12) * 10);
    [9, 23].forEach(dia => ps(dia, 'gasto', 'Transporte', 'Combustível', entre(12, 25) * 10));
    ps(7, 'gasto', 'Educação', 'Curso de inglês', 150);
    ps(16, 'gasto', 'Lazer', elegir(['Jantar fora', 'Cinema', 'Passeio de domingo']), entre(6, 18) * 10);
    if (r() < .6) ps(18, 'gasto', 'Roupas e beleza', elegir(['Roupas', 'Cabeleireiro', 'Sapatos']), entre(8, 25) * 10);
    if (r() < .4) ps(27, 'gasto', 'Outros', 'Presente de aniversário', entre(8, 15) * 10);
  }

  d.clientes.forEach(c => { c.ficha.act = c.alta; delete c.perfil; });
  d.seq = n;
  return d;
}

        <button class="btn btn-wa btn-sm" onclick="recordarTurno('${prox.id}')">${ico('wa')} WhatsApp</button>
      </div></div>`;
  }

  /* Línea de tiempo de hoy */
  const linea = deHoy.length ? deHoy.map(t => {
    const c = cliente(t.cli), s = servicio(t.serv), ahoraEs = turnoActivo(t) && t.estado !== 'realizado' && minutos(t.hora) <= ahora && finTurno(t) > ahora;
    return `<div class="lt-item st-${t.estado} ${ahoraEs ? 'ahora' : ''}" onclick="verTurno('${t.id}')">
      <div class="lt-hora">${t.hora}<small>${hhmm(finTurno(t))}</small></div><div class="lt-punto"></div>
      <div><div class="lt-n">${esc(c.nombre)} ${alertasCliente(c).length ? `<span class="alerta-mini" style="color:var(--mal)" title="${esc(alertasCliente(c).join(' · '))}">${ico('alerta')}</span>` : ''}</div>
        <div class="lt-s">${esc(s.nombre)}${t.precio === 0 && s.garantia ? ' · na garantia' : ''}</div></div>
      <div>${chipEstadoTurno(t.estado)}</div></div>`;
  }).join('') : `<div class="vacio">${ico('agenda')}Hoje não há atendimentos marcados.</div>`;

  /* A quién le toca el mantenimiento */
  const orden = { atrasada:0, toca:1, pronto:2 };
  const lista = mant.filter(x => orden[x.i.estado] != null).sort((a, b) => orden[a.i.estado] - orden[b.i.estado] || a.i.faltan - b.i.faltan);
  const mantHtml = lista.length ? lista.slice(0, 8).map(({ c, i }) => `<div class="lm-item"><div class="avatar">${iniciales(c.nombre)}</div>
      <div class="lm-txt" style="cursor:pointer" onclick="verCliente('${c.id}')"><div class="lm-t">${esc(c.nombre)}</div>
        <div class="lm-s">Última: ${esc(servicio(i.turno.serv).nombre.toLowerCase())} · ${cuando(i.ultima)}</div></div>
      ${chipMant(i)}
      <button class="btn btn-wa btn-xs" onclick="avisarMant('${c.id}')" aria-label="Avisar pelo WhatsApp">${ico('wa')}</button></div>`).join('') +
      (lista.length > 8 ? `<div class="mt-s"><a class="link" href="#clientas" onclick="CL.filtro='toca'">Ver as ${lista.length} →</a></div>` : '')
    : `<div class="vacio">Todas as suas clientes estão em dia com a manutenção.</div>`;

  /* Recordatorios de mañana */
  const deMan = turnosDelDia(man).filter(turnoActivo);
  const faltan = deMan.filter(t => !t.rec).length;
  const recs = deMan.length ? deMan.map(t => {
    const c = cliente(t.cli);
    return `<div class="lm-item ${t.rec ? 'hecho' : ''}"><div class="avatar">${iniciales(c.nombre)}</div>
      <div class="lm-txt"><div class="lm-t">${t.hora} · ${esc(c.nombre)}</div><div class="lm-s">${esc(servicio(t.serv).nombre)}</div></div>
      ${t.rec ? `<span class="chip c-ok">Enviado</span>` : `<button class="btn btn-wa btn-xs" onclick="recordarTurno('${t.id}')">${ico('wa')} Enviar</button>`}</div>`;
  }).join('') : `<div class="vacio">Não há atendimentos para amanhã.</div>`;

  /* Colocaciones agendadas sin seña */
  const sinSena = D().turnos.filter(t => t.fecha >= h && turnoActivo(t) && t.estado !== 'realizado' && servicio(t.serv).ciclo === 'inicia' && !senaDe(t)).sort(ordenTurno);
  const senaHtml = sinSena.length ? sinSena.map(t => { const c = cliente(t.cli); return `<div class="lm-item"><div class="avatar">${ico('sena')}</div>
      <div class="lm-txt" style="cursor:pointer" onclick="verTurno('${t.id}')"><div class="lm-t">${esc(c.nombre)}</div><div class="lm-s">${fMedia(t.fecha)} · ${t.hora} · ${esc(servicio(t.serv).nombre)}</div></div>
      <button class="btn btn-wa btn-xs" onclick="pedirSena('${t.id}')">${ico('wa')} Pedir</button></div>`; }).join('') : '';

  /* Cumpleaños de la semana */
  const cumples = D().clientes.filter(c => c.nac && difDias(h, proximoCumple(c.nac)) <= 7)
    .sort((a, b) => proximoCumple(a.nac).localeCompare(proximoCumple(b.nac)));
  const cumpleHtml = cumples.length ? cumples.map(c => {
    const f = proximoCumple(c.nac);
    return `<div class="lm-item"><div class="avatar">${ico('torta')}</div>
      <div class="lm-txt"><div class="lm-t">${esc(c.nombre)}</div><div class="lm-s">${f === h ? 'Hoje! ' : fLarga(f) + ' · '}faz ${edad(c.nac) + (f === h ? 0 : 1)} anos</div></div>
      <button class="btn btn-wa btn-xs" onclick="saludarCumple('${c.id}')">${ico('wa')} Parabenizar</button></div>`;
  }).join('') : `<div class="vacio">Nenhum aniversário nesta semana.</div>`;

  /* Insumos: en el mínimo o por vencer */
  const bajos = D().insumos.filter(p => estadoStock(p) !== 'ok');
  const vencen = D().insumos.filter(p => estadoVence(p) === 'vencido' || estadoVence(p) === 'pronto').sort((a, b) => a.vence.localeCompare(b.vence));
  const stockHtml = (bajos.length || vencen.length) ? bajos.slice(0, 5).map(p => `<div class="lm-item">
      <div class="lm-txt"><div class="lm-t">${esc(p.nombre)}</div><div class="lm-s">Você tem ${p.stock} · mínimo ${p.min}${enLista(p.id) ? ' · já está na lista' : ''}</div></div>${chipStock(p)}</div>`).join('') +
      vencen.slice(0, 3).map(p => `<div class="lm-item"><div class="lm-txt"><div class="lm-t">${esc(p.nombre)}</div><div class="lm-s">Validade</div></div>${chipVence(p)}</div>`).join('') +
      (bajos.some(p => !enLista(p.id)) ? `<div class="mt-s"><button class="btn btn-suave btn-xs" onclick="traerFaltantes()">${ico('carrito')} Trazer o que falta para a lista</button></div>` : '')
    : `<div class="vacio">Não falta nada.</div>`;

  $('#vista').innerHTML = kpis + `<div class="panel-grid">
    <div class="panel-col">
      ${proxHtml}
      <div class="card revelar"><div class="card-cab"><div class="card-t">Atendimentos de hoje <span class="card-num">${activosHoy.length}</span><small>${fLarga(h)}</small></div>
        <a class="link" href="#agenda" onclick="AG.vista='dia'; AG.fecha=hoy()">Ver agenda →</a></div><div class="linea">${linea}</div></div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Na hora da manutenção<small>A cada ${D().config.diasMant} dias · sem horário marcado</small></div>
        <a class="link" href="#clientas" onclick="CL.filtro='toca'">Clientes →</a></div><div class="lista-mini">${mantHtml}</div></div>
    </div>
    <div class="panel-col">
      <div class="card revelar"><div class="card-cab"><div class="card-t">Lembrar os horários de amanhã ${faltan ? `<span class="card-num">${faltan} sem enviar</span>` : ''}<small>${fLarga(man)}</small></div></div>
        <div class="lista-mini">${recs}</div></div>
      ${senaHtml ? `<div class="card revelar"><div class="card-cab"><div class="card-t">Aplicações sem sinal<small>Para garantir o horário</small></div></div><div class="lista-mini">${senaHtml}</div></div>` : ''}
      <div class="card revelar"><div class="card-cab"><div class="card-t">Aniversários da semana</div></div><div class="lista-mini">${cumpleHtml}</div></div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Materiais<small>No mínimo ou perto da validade</small></div><a class="link" href="#insumos" onclick="STK.tab='stock'">Materiais →</a></div><div class="lista-mini">${stockHtml}</div></div>
    </div></div>`;
};

// Lo último que se le hizo en las uñas (forma, largo, color)
function ultimoTrabajo(cid){
  return D().turnos.filter(t => t.cli === cid && t.estado === 'realizado' && t.trabajo).sort(ordenTurno).pop() || null;
}


/* ===== js/08-agenda.js ===== */
/* =====================================================================
   AGENDA · vistas diaria, semanal, mensual y anual
   (en el celular: día, lista y mes, con una tira de días para tocar)
   ===================================================================== */
const AG = { vista:'dia', fecha:null, estado:'' };
const PPM = 1.35;   // píxeles por minuto en las vistas de día y semana

function filtrarTurnos(lista){ return lista.filter(t => !AG.estado || t.estado === AG.estado); }
function rangoAgenda(){   // desde / hasta de la vista actual
  const f = AG.fecha;
  if (AG.vista === 'dia') return [f, f];
  if (AG.vista === 'lista') return [f, sumarDias(f, 13)];
  if (AG.vista === 'semana'){ const i = inicioSemana(f); return [i, sumarDias(i, 6)]; }
  if (AG.vista === 'mes') return [inicioMes(f), finMes(f)];
  const y = f.slice(0, 4); return [y + '-01-01', y + '-12-31'];
}
function etiquetaAgenda(){
  const f = AG.fecha, d = aFecha(f);
  if (AG.vista === 'dia') return fLarga(f);
  if (AG.vista === 'lista') return 'A partir de ' + d.getDate() + ' ' + MESES_C[d.getMonth()];
  if (AG.vista === 'semana'){ const [a, b] = rangoAgenda(); const da = aFecha(a), db = aFecha(b);
    return da.getDate() + (da.getMonth() !== db.getMonth() ? ' ' + MESES_C[da.getMonth()] : '') + ' – ' + db.getDate() + ' ' + MESES_C[db.getMonth()]; }
  if (AG.vista === 'mes') return MESES[d.getMonth()] + ' ' + d.getFullYear();
  return String(d.getFullYear());
}
function moverAgenda(n){
  const v = AG.vista;
  AG.fecha = v === 'dia' ? sumarDias(AG.fecha, n) : v === 'lista' ? sumarDias(AG.fecha, 14 * n) : v === 'semana' ? sumarDias(AG.fecha, 7 * n) : v === 'mes' ? sumarMeses(AG.fecha, n) : sumarMeses(AG.fecha, 12 * n);
  RENDER.agenda();
}
function verDia(f){ AG.vista = 'dia'; AG.fecha = f; RENDER.agenda(); window.scrollTo(0, 0); }

RENDER.agenda = function(){
  if (!AG.fecha) AG.fecha = hoy();
  encabezado('Agenda', 'Toque num espaço livre para marcar, ou num atendimento para vê-lo.',
    btnExportar('exportarAgenda') + `<button class="btn btn-oro" onclick="nuevoTurno({fecha:AG.fecha})">${ico('mas')} Novo agendamento</button>`);
  const movil = esMovil();
  // En el celular la semana y el año no entran bien: se ofrecen día, lista y mes
  if (movil && (AG.vista === 'semana' || AG.vista === 'anio')) AG.vista = 'dia';
  if (!movil && AG.vista === 'lista') AG.vista = 'semana';
  const vistas = movil ? [['dia','Dia'],['lista','Lista'],['mes','Mês']] : [['dia','Dia'],['semana','Semana'],['mes','Mês'],['anio','Ano']];
  const herr = `<div class="ag-herr">${movil && AG.vista !== 'mes' ? tiraDias() : ''}
    <div class="fila">
      <div class="segmento" role="tablist">${vistas.map(([k, t]) => `<button class="${AG.vista === k ? 'on' : ''}" onclick="AG.vista='${k}'; RENDER.agenda()">${t}</button>`).join('')}</div>
      <div class="navfecha"><button class="icon-btn" onclick="moverAgenda(-1)" aria-label="Anterior">${ico('izq')}</button>
        <span class="lbl">${etiquetaAgenda()}</span>
        <button class="icon-btn" onclick="moverAgenda(1)" aria-label="Próximo">${ico('der')}</button></div>
      <button class="btn btn-linea btn-sm" onclick="AG.fecha=hoy(); RENDER.agenda()">Hoje</button>
    </div>
    <div class="fila solo-compu">
      <select class="sel" onchange="AG.estado=this.value; RENDER.agenda()"><option value="">Todos os status</option>
        ${Object.keys(ESTADOS_TURNO).map(k => `<option value="${k}" ${AG.estado === k ? 'selected' : ''}>${ESTADOS_TURNO[k].t}</option>`).join('')}</select>
    </div></div>`;
  const cuerpo = AG.vista === 'lista' ? vistaLista() : AG.vista === 'dia' ? vistaDia() : AG.vista === 'semana' ? vistaSemana() : AG.vista === 'mes' ? vistaMes() : vistaAnio();
  const ley = `<div class="leyenda">${Object.keys(ESTADOS_TURNO).map(k => `<span><i class="dot-${k}"></i>${ESTADOS_TURNO[k].t}</span>`).join('')}</div>`;
  $('#vista').innerHTML = herr + `<div class="ag-caja">${cuerpo}${AG.vista === 'anio' || AG.vista === 'lista' ? '' : ley}</div>`;
  const sel = $('.tira-dias .on'); if (sel) sel.scrollIntoView({ inline:'center', block:'nearest' });
  if (AG.vista === 'dia' || AG.vista === 'semana'){   // desplazar hasta la hora actual en celular
    const sc = $('.ag-scroll'); if (sc && AG.vista === 'semana'){ const hoyCol = $('.ag-cab.hoy'); if (hoyCol) sc.scrollLeft = Math.max(0, hoyCol.offsetLeft - 60); }
  }
};

/* Rango de horas a mostrar: el horario de atención (o más, si hay turnos fuera de hora) */
function rangoHoras(ts){
  const hor = D().config.horario;
  let a = minutos(hor.desde), b = minutos(hor.hasta);
  ts.forEach(t => { a = Math.min(a, minutos(t.hora)); b = Math.max(b, finTurno(t)); });
  return [Math.floor(a / 60) * 60, Math.ceil(b / 60) * 60];
}
function columnaHoras(ini, fin){
  let h = '';
  for (let m = ini; m <= fin; m += 60) h += `<div class="ag-hora" style="top:${(m - ini) * PPM}px">${hhmm(m)}</div>`;
  return `<div class="ag-horas" style="height:${(fin - ini) * PPM}px">${h}</div>`;
}
function lineasHoras(ini, fin){
  let h = '';
  for (let m = ini; m < fin; m += 30) h += `<div class="ag-linea ${m % 60 ? 'media' : ''}" style="top:${(m - ini) * PPM}px"></div>`;
  return h;
}
function lineaAhora(f, ini, fin){ const a = ahoraMin(); return f === hoy() && a >= ini && a <= fin ? `<div class="ag-ahora" style="top:${(a - ini) * PPM}px"></div>` : ''; }
function bloqueTurno(t, ini, estilo, corto){
  const c = cliente(t.cli), s = servicio(t.serv), al = alertasCliente(c).length;
  const alto = Math.max(t.dur * PPM - 3, 24);
  return `<div class="turno p1 st-${t.estado}" style="top:${(minutos(t.hora) - ini) * PPM + 1}px;height:${alto}px;${estilo}"
      onclick="event.stopPropagation(); verTurno('${t.id}')" title="${esc(t.hora + ' ' + c.nombre + ' · ' + s.nombre)}">
    <span class="tst dot-${t.estado}"></span>
    <div class="tn">${al ? `<span class="alerta-mini">${ico('alerta')}</span>` : ''}${corto ? t.hora + ' ' : ''}${esc(corto ? primerNombre(c.nombre) + ' ' + (c.nombre.split(' ')[1] || '').charAt(0) + '.' : c.nombre)}</div>
    ${alto > 34 ? `<div class="ts">${corto ? esc(s.nombre) : t.hora + '–' + hhmm(finTurno(t)) + ' · ' + esc(s.nombre)}</div>` : ''}</div>`;
}
function clicColumna(ev, f){
  const r = ev.currentTarget.getBoundingClientRect();
  let m = AG._ini + (ev.clientY - r.top) / PPM;
  m = Math.floor(m / 15) * 15;
  nuevoTurno({ fecha:f, hora:hhmm(m) });
}

function vistaDia(){
  const f = AG.fecha;
  const ts = filtrarTurnos(turnosDelDia(f));
  const [ini, fin] = rangoHoras(ts); AG._ini = ini;
  const cerrado = !D().config.horario.dias.includes(diaSemana(f));
  const alto = (fin - ini) * PPM;
  let html = `<div class="ag-scroll"><div class="ag-grilla" style="grid-template-columns:58px minmax(200px, 1fr)">
    <div class="ag-cab"></div><div class="ag-cab">${DIAS_C[diaSemana(f)]} <b>${aFecha(f).getDate()}</b>
      <div class="muted" style="font-weight:500;font-size:11px">${ts.filter(turnoActivo).length} atendimentos</div></div>` +
    columnaHoras(ini, fin) +
    `<div class="ag-col ${cerrado ? 'cerrado' : ''}" style="height:${alto}px" onclick="clicColumna(event,'${f}')">
      ${lineasHoras(ini, fin)}${lineaAhora(f, ini, fin)}
      ${ts.map(t => bloqueTurno(t, ini, 'left:6px;right:6px')).join('')}</div>` +
    `</div></div>`;
  if (cerrado) html = `<div class="caja-info" style="border-radius:0">${ico('info')}<div>Neste dia você não atende (segundo o seu horário). Mesmo assim pode marcar, se precisar.</div></div>` + html;
  return html;
}

function vistaSemana(){
  const ini0 = inicioSemana(AG.fecha), h = hoy();
  const dias = []; for (let i = 0; i < 7; i++) dias.push(sumarDias(ini0, i));
  const hor = D().config.horario;
  const todos = filtrarTurnos(D().turnos.filter(t => t.fecha >= dias[0] && t.fecha <= dias[6]));
  const visibles = dias.filter(f => hor.dias.includes(diaSemana(f)) || todos.some(t => t.fecha === f));
  const [ini, fin] = rangoHoras(todos); AG._ini = ini;
  const alto = (fin - ini) * PPM;
  return `<div class="ag-scroll"><div class="ag-grilla" style="grid-template-columns:58px repeat(${visibles.length}, minmax(112px, 1fr))">
    <div class="ag-cab"></div>` +
    visibles.map(f => `<div class="ag-cab ${f === h ? 'hoy' : ''}" style="cursor:pointer" onclick="verDia('${f}')">${DIAS_C[diaSemana(f)]}<b>${aFecha(f).getDate()}</b></div>`).join('') +
    columnaHoras(ini, fin) +
    visibles.map(f => `<div class="ag-col" style="height:${alto}px" onclick="clicColumna(event,'${f}')">
      ${lineasHoras(ini, fin)}${lineaAhora(f, ini, fin)}
      ${todos.filter(t => t.fecha === f).map(t => bloqueTurno(t, ini, 'left:4px;right:4px', true)).join('')}</div>`).join('') +
    `</div></div>`;
}

function vistaMes(){
  const f = AG.fecha, m = aFecha(f).getMonth(), h = hoy();
  let dia = inicioSemana(inicioMes(f)); const fin = finMes(f);
  let celdas = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x => `<div class="mes-dsem">${x}</div>`).join('');
  const todos = filtrarTurnos(D().turnos);
  while (dia <= fin || diaSemana(dia) !== 1){
    const ts = todos.filter(t => t.fecha === dia).sort(ordenTurno), act = ts.filter(turnoActivo);
    celdas += `<div class="mes-dia ${aFecha(dia).getMonth() !== m ? 'fuera' : ''} ${dia === h ? 'hoy' : ''}" onclick="verDia('${dia}')">
      <div class="mes-n">${aFecha(dia).getDate()}</div>
      ${ts.slice(0, 3).map(t => `<div class="mes-t p1 st-${t.estado}">${t.hora} ${esc(primerNombre(cliente(t.cli).nombre))}</div>`).join('')}
      ${ts.length > 3 ? `<div class="mes-mas">+${ts.length - 3} más</div>` : ''}
      ${act.length ? `<div class="mes-cuenta">${act.length}</div>` : ''}</div>`;
    dia = sumarDias(dia, 1);
    if (dia > fin && diaSemana(dia) === 1) break;
  }
  return `<div class="mes-grilla">${celdas}</div>`;
}

function vistaAnio(){
  const y = aFecha(AG.fecha).getFullYear(), h = hoy();
  const cuenta = {};
  filtrarTurnos(D().turnos).forEach(t => { if (t.fecha.startsWith(y) && turnoActivo(t)) cuenta[t.fecha] = (cuenta[t.fecha] || 0) + 1; });
  let html = '';
  for (let m = 0; m < 12; m++){
    const ini = y + '-' + p2(m + 1) + '-01', off = (diaSemana(ini) + 6) % 7, fin = finMes(ini);
    const total = Object.keys(cuenta).filter(k => k.slice(5, 7) === p2(m + 1)).reduce((s, k) => s + cuenta[k], 0);
    let g = ['L','M','M','J','V','S','D'].map(x => `<span class="h">${x}</span>`).join('') + '<span></span>'.repeat(off);
    for (let dd = ini; dd <= fin; dd = sumarDias(dd, 1)){
      const n = cuenta[dd] || 0, niv = n === 0 ? '' : n <= 1 ? 'n1' : n <= 3 ? 'n2' : n <= 4 ? 'n3' : 'n4';
      g += `<span class="${niv} ${dd === h ? 'hoy' : ''}" onclick="verDia('${dd}')" title="${fCorta(dd)}: ${n} atendimentos">${aFecha(dd).getDate()}</span>`;
    }
    html += `<div><div class="am-t" onclick="AG.vista='mes'; AG.fecha='${ini}'; RENDER.agenda()">${MESES[m]} <span class="muted" style="font-family:var(--f-cuerpo);font-size:11.5px">${total} atendimentos</span></div><div class="am-g">${g}</div></div>`;
  }
  return `<div class="anio-grilla">${html}</div><div class="leyenda"><span>Atendimentos por dia:</span>
    <span><i class="n1"></i>1</span><span><i class="n2"></i>2–3</span>
    <span><i class="n3"></i>4</span><span><i class="n4"></i>5 o más</span></div>`;
}

function exportarAgenda(){
  const [a, b] = rangoAgenda();
  const ts = filtrarTurnos(D().turnos.filter(t => t.fecha >= a && t.fecha <= b)).sort(ordenTurno);
  exportarCSV('Agenda ' + etiquetaAgenda(), ['Data','Hora','Duração (min)','Cliente','Telefone','Serviço','Status','Preço','Lembrete enviado','Observação'],
    ts.map(t => { const c = cliente(t.cli); return [fCorta(t.fecha), t.hora, t.dur, c.nombre, c.tel, servicio(t.serv).nombre, ESTADOS_TURNO[t.estado].t, t.precio, t.rec ? 'Sim' : 'Não', t.nota]; }));
}

/* ---------- Celular: tira de días y vista de lista ---------- */
function tiraDias(){
  const h = hoy(), ini = sumarDias(AG.fecha, -3);
  let html = '';
  for (let k = 0; k < 21; k++){
    const f = sumarDias(ini, k), n = D().turnos.filter(t => t.fecha === f && turnoActivo(t)).length;
    html += `<button class="td-dia ${f === AG.fecha ? 'on' : ''} ${f === h ? 'hoy' : ''} ${D().config.horario.dias.includes(diaSemana(f)) ? '' : 'cerrado'}" onclick="AG.fecha='${f}'; if(AG.vista==='mes') AG.vista='dia'; RENDER.agenda()">
      <small>${f === h ? 'Hoje' : DIAS_C[diaSemana(f)]}</small><b>${aFecha(f).getDate()}</b><i>${n ? '•'.repeat(Math.min(n, 4)) : ''}</i></button>`;
  }
  return `<div class="tira-dias">${html}</div>`;
}
function vistaLista(){
  const [a, b] = rangoAgenda(), h = hoy();
  let html = '';
  for (let f = a; f <= b; f = sumarDias(f, 1)){
    const ts = filtrarTurnos(turnosDelDia(f));
    if (!ts.length && f !== h) continue;
    html += `<div class="li-dia ${f === h ? 'hoy' : ''}"><div class="li-cab"><b>${f === h ? 'Hoje' : f === sumarDias(h, 1) ? 'Amanhã' : DIAS[diaSemana(f)]}</b>
        <span>${aFecha(f).getDate()} de ${MESES[aFecha(f).getMonth()]}</span><span class="li-n">${ts.filter(turnoActivo).length || ''}</span></div>` +
      (ts.length ? ts.map(t => { const c = cliente(t.cli), s = servicio(t.serv);
        return `<div class="li-turno st-${t.estado}" onclick="verTurno('${t.id}')"><div class="li-hora">${t.hora}<small>${hhmm(finTurno(t))}</small></div>
          <div class="li-txt"><div class="fuerte">${alertasCliente(c).length ? `<span class="alerta-mini" style="color:var(--mal)">${ico('alerta')}</span> ` : ''}${esc(c.nombre)}</div><div class="persona-s">${esc(s.nombre)}</div></div>
          ${chipEstadoTurno(t.estado)}</div>`; }).join('')
        : `<div class="vacio" style="padding:14px">Sem atendimentos. <a class="link" href="javascript:void(0)" onclick="nuevoTurno({fecha:'${f}'})">Marcar</a></div>`) + '</div>';
  }
  return `<div class="li-caja">${html || '<div class="vacio">Não há atendimentos nestas duas semanas.</div>'}</div>`;
}


/* ===== js/09-turnos.js ===== */
/* =====================================================================
   TURNOS (atendimentos) · ver, crear, editar/mover, seña (sinal), cambiar estado,

   ===================================================================== */
let FT = null;   // turno que se está editando

function verTurno(id){

      <div class="ficha-datos">
        <div><div class="dato-l">Duração</div><div class="dato-v">${t.dur} minutos</div></div>
        <div><div class="dato-l">Preço</div><div class="dato-v">${t.precio === 0 && s.garantia ? 'Sem custo · garantia' : pesos(t.precio)}</div></div>
        <div><div class="dato-l">Sinal</div><div class="dato-v">${sena ? pesos(sena.monto) + ' · ' + sena.medio : '<span class="muted">Sem sinal</span>'}</div></div>
        <div><div class="dato-l">Lembrete</div><div class="dato-v">${t.rec ? '<span class="pos">✓ Enviado</span>' : '<span class="muted">Não enviado</span>'}</div></div>
        <div><div class="dato-l">Pagamento</div><div class="dato-v">${cobro ? pesos(cobro.monto) + ' · ' + cobro.medio : '—'}</div></div>
        <div><div class="dato-l">Tipo</div><div class="dato-v">${esc(s.cat)}</div></div>
      </div>
      ${tr ? `<div class="ultima-vez mt">${dibujoUna(tr.forma, tr.largo, tr.color, 64)}
        <div><div class="dato-l">${t.trabajo ? 'O que foi feito' : 'Da última vez · ' + fMedia(ult.fecha)}</div>
          <div class="fuerte">${esc(tr.forma)} · ${esc(tr.largo.toLowerCase())} · ${esc(tr.color)}</div>
          <div class="persona-s">${esc(tr.tecnica)}${tr.diseno ? ' · ' + esc(tr.diseno) : ''}</div></div></div>` : ''}
      ${t.nota ? `<div class="caja-info mt">${ico('info')}<div><b>Observação:</b> ${esc(t.nota)}</div></div>` : ''}`,
    pie: `<button class="btn btn-linea izq" onclick="editarTurno('${t.id}')">${ico('editar')} Editar / remarcar</button>
      <button class="btn btn-wa" onclick="recordarTurno('${t.id}')">${ico('wa')} Lembrar</button>
      ${pendiente && !sena ? `<button class="btn btn-linea" onclick="formSena('${t.id}')">${ico('sena')} Registrar sinal</button>` : ''}
      ${t.estado === 'pendiente' ? `<button class="btn btn-suave" onclick="cambiarEstado('${t.id}','confirmado')">Confirmar</button>` : ''}
      ${pendiente ? `<button class="btn btn-linea" onclick="cambiarEstado('${t.id}','noasistio')">Faltou</button>
        <button class="btn btn-linea" onclick="cambiarEstado('${t.id}','cancelado')">Cancelar horário</button>
        <button class="btn btn-oro" onclick="marcarRealizado('${t.id}')">${ico('ok')} Finalizado</button>` : ''}
      ${!pendiente ? `<button class="btn btn-linea" onclick="cambiarEstado('${t.id}','confirmado')">Voltar a «Confirmado»</button>` : ''}`
  });
}

function nuevoTurno(pre){
  pre = pre || {};
  const h = hoy();
  const base = { cli:'', serv:'', fecha:h, hora:'', dur:90, precio:0, estado:'pendiente', rec:false, nota:'' };
  if (!pre.hora){ const m = Math.max(minutos(D().config.horario.desde), Math.ceil(ahoraMin() / 30) * 30); base.hora = (pre.fecha && pre.fecha !== h) ? D().config.horario.desde : hhmm(Math.min(m, minutos('17:30'))); }
  FT = { t: Object.assign(base, pre), nuevo:true };
  if (FT.t.serv){ const s = servicio(FT.t.serv); if (!pre.dur) FT.t.dur = s.dur; if (!pre.precio) FT.t.precio = s.precio; }
  formTurno();
}
function editarTurno(id){ FT = { t: turno(id), nuevo:false }; formTurno(); }

function formTurno(){
  const t = FT.t;
  const clientes = D().clientes.slice().sort((a, b) => a.nombre.localeCompare(b.nombre));
  const servs = D().servicios.filter(s => s.activo || s.id === t.serv);
  const selServ = '<select name="serv" onchange="alCambiarServicio()"><option value="">Escolha o serviço…</option>' +
    CATEGORIAS_SERVICIO.map(cat => { const l = servs.filter(s => s.cat === cat); return l.length ? `<optgroup label="${cat}">` +
      l.map(s => `<option value="${s.id}" ${s.id === t.serv ? 'selected' : ''}>${esc(s.nombre)} · ${s.dur} min · ${pesos(s.precio)}</option>`).join('') + '</optgroup>' : ''; }).join('') + '</select>';
  abrirModal({
    titulo: FT.nuevo ? 'Novo agendamento' : 'Editar agendamento',
    sub: FT.nuevo ? 'Ao escolher o serviço, a duração e o preço se completam sozinhos.' : 'Você pode mudar o dia ou a hora para remarcar.',
    ancho: 'md',
    cuerpo: `<form class="form" id="f-turno" onsubmit="guardarTurno(); return false">
      ${campo('Cliente', sel('cli', [['', 'Escolha a cliente…']].concat(clientes.map(c => [c.id, c.nombre + ' · ' + c.tel])), t.cli, 'onchange="alCambiarCliente()"'),
        { ancho:true, ayuda: FT.nuevo ? '<a class="link" href="javascript:void(0)" onclick="clienteDesdeTurno()">+ Nova cliente</a>' : '' })}
      <div id="ft-alerta" class="ancho"></div>
      ${campo('Serviço', selServ, { ancho:true })}
      <div id="ft-pista" class="ancho"></div>
      ${campo('Data', inp('fecha', t.fecha, 'date', 'onchange="pistaTurno(true)"'))}
      ${campo('Hora', inp('hora', t.hora, 'time', 'step="900"'))}
      ${campo('Duração (minutos)', inp('dur', t.dur, 'number', 'min="5" step="5"'))}
      ${campo('Preço (R$)', inp('precio', t.precio, 'number', 'min="0" step="5"'))}
      ${campo('Status', sel('estado', Object.keys(ESTADOS_TURNO).map(k => [k, ESTADOS_TURNO[k].t]), t.estado), { ancho:true })}
      ${campo('Observação', area('nota', t.nota, 'placeholder="Ex.: quer mudar para o formato bailarina, vai trazer foto da decoração…"'), { ancho:true })}
      <button type="submit" hidden></button></form>`,
    pie: (FT.nuevo ? '' : `<button class="btn btn-peligro izq" onclick="borrarTurno('${t.id}')">${ico('borrar')} Excluir</button>`) +
      `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="guardarTurno()">${FT.nuevo ? 'Marcar horário' : 'Salvar alterações'}</button>`,
    alAbrir: () => alCambiarCliente()
  });
}
function alCambiarCliente(){
  const c = cliente($('#f-turno [name=cli]').value), al = alertasCliente(c);
  $('#ft-alerta').innerHTML = al.length ? `<div class="caja-info alerta">${ico('alerta')}<div><b>Ficha:</b> ${al.map(esc).join(' · ')}</div></div>` : '';
  pistaTurno();
}
function alCambiarServicio(){
  const s = servicio($('#f-turno [name=serv]').value); if (!s) return;
  $('#f-turno [name=dur]').value = s.dur;
  $('#f-turno [name=precio]').value = s.precio;
  pistaTurno(true);
}
// Pistas según la clienta y el servicio: mantenimiento fuera de término, garantía, seña
function pistaTurno(ajustarPrecio){
  const f = $('#f-turno'); if (!f) return;
  const cid = f.querySelector('[name=cli]').value, s = servicio(f.querySelector('[name=serv]').value), fecha = f.querySelector('[name=fecha]').value;
  let html = '';
  if (cid && s){
    const i = infoMant(cid);
    if (s.ciclo === 'mant' && i.estado === 'sin') html = `<div class="caja-info">${ico('info')}<div>Ela está sem alongamento: talvez seja uma <b>aplicação</b>.</div></div>`;
    else if (s.ciclo === 'mant' && i.ultima){
      const dias = difDias(i.ultima, fecha || hoy());
      html = `<div class="caja-info">${ico('ciclo')}<div>Serão <b>${dias} dias</b> desde a última ${esc(servicio(i.turno.serv).nombre.toLowerCase())} (${fMedia(i.ultima)}).
        ${dias > 28 && s.id === 's4' ? 'Passaram mais de 4 semanas: corresponde à <b>manutenção fora do prazo</b>.' : ''}</div></div>`;
    }
    if (s.garantia){
      const g = garantiaVigente(cid, fecha);
      if (g){ html = `<div class="caja-info ok">${ico('escudo')}<div><b>Na garantia:</b> a ${esc(servicio(g.serv).nombre.toLowerCase())} foi em ${fMedia(g.fecha)} (há menos de ${D().config.diasGarantia} dias). O reparo é <b>sem custo</b>.</div></div>`;
        if (ajustarPrecio) f.querySelector('[name=precio]').value = 0; }
    }
    if (s.ciclo === 'inicia') html += `<div class="caja-info mt-s">${ico('sena')}<div>É uma aplicação: você pode pedir um <b>sinal de ${pesos(D().config.senaColocacion)}</b> para garantir o horário (depois de marcar, pelo atendimento).</div></div>`;
  }
  $('#ft-pista').innerHTML = html;
}
function clienteDesdeTurno(){
  const v = leerForm($('#f-turno'));
  const pre = Object.assign({}, FT.t, v, { dur:Number(v.dur) || 90, precio:Number(v.precio) || 0 });
  formCliente(null, id => nuevoTurno(Object.assign(pre, { cli:id })));
}

async function guardarTurno(){
  const v = leerForm($('#f-turno'));
  if (!v.cli) return avisar('Escolha a cliente', 'alerta');
  if (!v.serv) return avisar('Escolha o serviço', 'alerta');
  if (!v.fecha || !v.hora) return avisar('Preencha a data e a hora', 'alerta');
  const t = FT.t, previo = FT.nuevo ? null : t.estado;
  const n = Object.assign({}, t, { cli:v.cli, serv:v.serv, fecha:v.fecha, hora:v.hora,
    dur:Number(v.dur) || servicio(v.serv).dur, precio:Number(v.precio) || 0, estado:v.estado, nota:v.nota });
  // Controles: horario de atención y superposición (atiende sola, una clienta a la vez)
  const hor = D().config.horario, avisos = [];
  if (!hor.dias.includes(diaSemana(n.fecha))) avisos.push('Nesse dia você <b>não atende</b>.');
  else if (minutos(n.hora) < minutos(hor.desde) || finTurno(n) > minutos(hor.hasta)) avisos.push(`Fica <b>fora do seu horário</b> (${hor.desde} às ${hor.hasta}).`);
  const sup = turnoActivo(n) ? superposicion(n) : null;
  if (sup) avisos.push(`<b>Coincide</b> com o horário de ${esc(cliente(sup.cli).nombre)} (${sup.hora} às ${hhmm(finTurno(sup))}).`);
  if (avisos.length && !(await confirmar('Salvar mesmo assim?', avisos.join('<br>'), 'Salvar mesmo assim'))) return;

  if (!FT.nuevo && (t.fecha !== n.fecha || t.hora !== n.hora)) n.rec = false;   // se movió: hay que volver a avisar
  const pasaARealizado = n.estado === 'realizado' && previo !== 'realizado';
  if (pasaARealizado) n.estado = previo || 'confirmado';
  if (FT.nuevo){ n.id = Store.id('t'); D().turnos.push(n); } else Object.assign(t, n);
  guardar();
  if (pasaARealizado){ refrescar(); marcarRealizado(n.id); return; }
  cerrarModal(); refrescar();
  avisar(FT.nuevo ? 'Horário marcado: ' + fLarga(n.fecha) + ', às ' + n.hora : 'Agendamento atualizado', 'agenda');
  if (FT.nuevo && servicio(n.serv).ciclo === 'inicia') verTurno(n.id);
}
async function borrarTurno(id){
  if (!(await confirmar('Excluir este agendamento?', 'Sai da agenda. Se tinha um sinal ou pagamento registrado, ele continua no Financeiro do salão.', 'Excluir', true))) return;
  D().turnos = D().turnos.filter(t => t.id !== id); guardar(); cerrarModal(); refrescar(); avisar('Agendamento excluído', 'borrar');
}
async function cambiarEstado(id, e){
  const t = turno(id);
  if (e === 'cancelado' && !(await confirmar('Cancelar o horário?', 'Fica na agenda como «Cancelado» e o horário é liberado.' + (senaDe(t) ? ' O sinal continua registrado: se você devolver, exclua no Financeiro do salão.' : ''), 'Cancelar horário', true))) return;
  t.estado = e; guardar(); refrescar(); verTurno(id);
  avisar('Atendimento: ' + ESTADOS_TURNO[e].t.toLowerCase());
}

/* ---------- Seña (sinal) ---------- */
function formSena(id){
  const t = turno(id), c = cliente(t.cli);
  abrirModal({
    titulo: 'Registrar sinal', sub: esc(c.nombre) + ' · ' + esc(servicio(t.serv).nombre) + ' · ' + fMedia(t.fecha),
    cuerpo: `<form class="form" id="f-sena" onsubmit="return false">
      ${campo('Valor (R$)', inp('monto', D().config.senaColocacion, 'number', 'min="0" step="5"'))}
      ${campo('Forma de pagamento', sel('medio', MEDIOS_PAGO, 'Pix'))}
      <div class="ancho caja-info">${ico('info')}<div>Ao finalizar o atendimento, a página desconta o sinal do pagamento.</div></div>
      <div class="ancho"><button type="button" class="btn btn-wa btn-sm" onclick="pedirSena('${id}')">${ico('wa')} Pedir pelo WhatsApp</button></div></form>`,
    pie: `<button class="btn btn-linea" onclick="verTurno('${id}')">Voltar</button><button class="btn btn-oro" onclick="guardarSena('${id}')">Salvar sinal</button>`
  });
}
function guardarSena(id){
  const t = turno(id), v = leerForm($('#f-sena'));
  if (!(v.monto > 0)) return avisar('Informe o valor', 'alerta');
  nuevoMov({ tipo:'ing', cat:'Sinais', concepto:'Sinal · ' + servicio(t.serv).nombre, monto:v.monto, medio:v.medio, cli:t.cli, turno:t.id });
  if (t.estado === 'pendiente') t.estado = 'confirmado';
  guardar(); refrescar(); verTurno(id); avisar('Sinal de ' + pesos(v.monto) + ' registrado · horário confirmado', 'sena');
}

/* ---------- Terminado → qué se hizo + cobro ---------- */
function marcarRealizado(id){
  const t = turno(id), c = cliente(t.cli), s = servicio(t.serv), f = c.ficha || {}, sena = senaDe(t);
  const conUnas = s.ciclo === 'inicia' || s.ciclo === 'mant';
  const ant = ultimoTrabajo(c.id), tr = t.trabajo || (ant && ant.trabajo) || { tecnica:f.tecnica, forma:f.forma, largo:f.largo, color:f.color, diseno:'' };
  const aCobrar = Math.max(0, t.precio - (sena ? sena.monto : 0));
  abrirModal({
    titulo: 'Atendimento finalizado', sub: 'Fica no histórico da cliente e, se for aplicação ou manutenção, recomeça a contagem de ' + D().config.diasMant + ' dias.',
    ancho: 'md',
    cuerpo: `<form class="form" id="f-cobro" onsubmit="return false">
      <div class="ancho caja-info ok">${ico('ok')}<div><b>${esc(c.nombre)}</b> · ${esc(s.nombre)}<br>${fLarga(t.fecha)} · ${t.hora}</div></div>
      ${conUnas ? `<div class="form-sep">Como ficaram as unhas</div>
        <div class="ancho una-form"><div id="una-prev">${dibujoUna(tr.forma, tr.largo, tr.color, 96)}</div><div class="form" style="flex:1">
        ${campo('Técnica', sel('tecnica', TECNICAS, tr.tecnica))}
        ${campo('Formato', sel('forma', FORMAS_UNA, tr.forma, 'onchange="previaUna()"'))}
        ${campo('Comprimento', sel('largo', LARGOS_UNA, tr.largo, 'onchange="previaUna()"'))}
        ${campo('Cor', sel('color', Object.keys(COLORES_UNA), tr.color, 'onchange="previaUna()"'))}
        ${campo('Decoração (opcional)', inp('diseno', '', 'text', 'placeholder="Ex.: nail art em duas unhas, pedrarias…"'), { ancho:true })}</div></div>
        <div class="ancho">${check('aFicha', true, 'Salvar este formato, comprimento e cor na ficha dela')}</div>` : ''}
      <div class="form-sep">Pagamento</div>
      ${sena ? `<div class="ancho caja-info">${ico('sena')}<div>Ela deixou um <b>sinal de ${pesos(sena.monto)}</b>: é descontado do preço (${pesos(t.precio)}).</div></div>` : ''}
      ${t.precio === 0 && s.garantia ? `<div class="ancho caja-info ok">${ico('escudo')}<div>Reparo <b>na garantia</b>: não se cobra.</div></div>` : ''}
      <div class="ancho">${check('cobrar', aCobrar > 0, 'Registrar o pagamento', 'onchange="$(\'#cobro-campos\').style.display=this.checked?\'\':\'none\'"')}</div>
      <div id="cobro-campos" class="ancho form" style="${aCobrar > 0 ? '' : 'display:none'}">
        ${campo('Valor (R$)', inp('monto', aCobrar, 'number', 'min="0" step="5"'), { ayuda: sena ? 'Preço menos o sinal' : 'Se somou uma decoração, ajuste aqui' })}
        ${campo('Forma de pagamento', sel('medio', MEDIOS_PAGO, 'Pix'))}
      </div></form>`,
    pie: `<button class="btn btn-linea" onclick="verTurno('${id}')">Voltar</button><button class="btn btn-oro" onclick="confirmarRealizado('${id}')">${ico('ok')} Confirmar</button>`
  });
}
function previaUna(){
  const f = $('#f-cobro'); if (!f) return;
  const g = n => f.querySelector('[name=' + n + ']').value;
  $('#una-prev').innerHTML = dibujoUna(g('forma'), g('largo'), g('color'), 96);
}
function confirmarRealizado(id){
  const t = turno(id), s = servicio(t.serv), c = cliente(t.cli), v = leerForm($('#f-cobro'));
  t.estado = 'realizado';
  let msg = 'Atendimento finalizado';
  if (v.forma){
    t.trabajo = { tecnica:v.tecnica, forma:v.forma, largo:v.largo, color:v.color, diseno:v.diseno };
    if (v.aFicha) Object.assign(c.ficha, { tecnica:v.tecnica, forma:v.forma, largo:v.largo, color:v.color, act:hoy() });
    msg += ' · próxima manutenção ' + fMedia(sumarDias(t.fecha, D().config.diasMant));
  }
  if (v.cobrar && Number(v.monto) > 0){
    nuevoMov({ fecha:t.fecha, tipo:'ing', cat:'Atendimentos', concepto:s.nombre + (v.diseno ? ' + ' + v.diseno : ''), monto:v.monto, medio:v.medio, cli:t.cli, serv:t.serv, turno:t.id });
    msg += ' · pagamento de ' + pesos(v.monto);
  }
  guardar(); cerrarModal(); refrescar(); avisar(msg);
}

/* ---------- WhatsApp ---------- */
// «10 de novembro (terça)»: así se lee bien después de «no dia»
function diaMensaje(f){ const d = aFecha(f); return d.getDate() + ' de ' + MESES[d.getMonth()] + ' (' + DIAS[d.getDay()].split('-')[0] + ')'; }
function recordarTurno(id){
  const t = turno(id), c = cliente(t.cli), s = servicio(t.serv);
  abrirWhatsApp(c.tel, textoMensaje(D().config.mensajes.turno, { nome:primerNombre(c.nombre), servico:s.nombre.toLowerCase(), dia:diaMensaje(t.fecha), hora:t.hora }));
  t.rec = true; guardar(); refrescar();
  if (modalAbierto() && $('#modal-titulo').textContent === s.nombre) verTurno(id);
  avisar('O WhatsApp abriu com o lembrete para ' + primerNombre(c.nombre), 'wa');
}
function avisarMant(cid){

/* =====================================================================

   ===================================================================== */
const CL = { q:'', filtro:'todas', lim:40, tab:'unas' };
const FILTROS_CLI = [['todas','Todas'],['toca','Na hora da manutenção'],['atrasada','Atrasadas'],['alerta','Com alertas'],['nuevas','Novas (30 dias)'],['sin','Sem alongamento'],['cumple','Aniversário no mês']];

function clientesFiltradas(idx, mant){
  const q = CL.q.toLowerCase(), h = hoy(), mes = aFecha(h).getMonth();
  return D().clientes.filter(c => {
    if (q && !(c.nombre.toLowerCase().includes(q) || c.tel.replace(/\D/g, '').includes(q.replace(/\D/g, '') || '§'))) return false;
    const e = mant[c.id].estado;
    switch (CL.filtro){
      case 'toca': return e === 'toca' || e === 'atrasada' || e === 'pronto';
      case 'atrasada': return e === 'atrasada';
      case 'alerta': return alertasCliente(c).length > 0;
      case 'nuevas': return difDias(c.alta, h) <= 30;
      case 'sin': return e === 'sin';
      case 'cumple': return c.nac && aFecha(c.nac).getMonth() === mes;
    }
    return true;
  }).sort((a, b) => CL.filtro === 'toca' ? (mant[a.id].faltan - mant[b.id].faltan) : a.nombre.localeCompare(b.nombre));
}

RENDER.clientas = function(){
  encabezado('Clientes', D().clientes.length + ' clientes · busque pelo nome ou telefone',
    btnExportar('exportarClientes') + `<button class="btn btn-oro" onclick="formCliente()">${ico('mas')} Nova cliente</button>`);
  $('#vista').innerHTML = `<div class="herr">
      <div class="buscar">${ico('buscar')}<input id="cli-q" type="search" placeholder="Buscar pelo nome ou telefone…" value="${esc(CL.q)}" oninput="CL.q=this.value; CL.lim=40; pintarClientes()"></div>
      <div class="pildoras" id="cli-filtros"></div></div>
    <div class="tabla-caja revelar" id="cli-lista"></div>`;
  pintarClientes();
};
function pintarClientes(){
  const idx = indiceClientes(), mant = {}, h = hoy();
  D().clientes.forEach(c => mant[c.id] = infoMant(c.id));
  const lista = clientesFiltradas(idx, mant);
  const guardado = CL.filtro, cuenta = {};
  FILTROS_CLI.forEach(([k]) => { CL.filtro = k; cuenta[k] = clientesFiltradas(idx, mant).length; }); CL.filtro = guardado;
  $('#cli-filtros').innerHTML = FILTROS_CLI.map(([k, t]) => `<button class="pildora ${CL.filtro === k ? 'on' : ''}" onclick="CL.filtro='${k}'; CL.lim=40; pintarClientes()">${t} <span class="n">${cuenta[k]}</span></button>`).join('');
  const filas = lista.slice(0, CL.lim).map(c => {
    const st = idx[c.id], m = mant[c.id], f = c.ficha || {}, cumple = c.nac && difDias(h, proximoCumple(c.nac)) <= 7;
    return `<div class="fila-cli" onclick="verCliente('${c.id}')">
      <div class="persona"><div class="avatar">${iniciales(c.nombre)}</div><div style="min-width:0"><div class="persona-n">${esc(c.nombre)}</div><div class="persona-s">${esc(c.tel)}</div></div></div>
      <div class="c-una">${dibujoUna(f.forma, f.largo, f.color, 34)}<div><div class="fuerte" style="font-size:12.5px">${esc(f.forma || '—')} · ${esc((f.largo || '').toLowerCase())}</div><div class="persona-s">${esc(f.tecnica || '')}</div></div></div>
      <div class="c-ult">${st.ultima ? fMedia(st.ultima) + '<div class="persona-s">' + cuando(st.ultima) + '</div>' : '<span class="muted">Sem visitas</span>'}</div>
      <div>${chipMant(m)}</div>

        ${difDias(c.alta, h) <= 30 ? '<span class="chip c-conf">Nova</span>' : ''}
        ${cumple ? `<span class="chip c-lila sin-punto">${ico('torta')} Aniversário</span>` : ''}</div></div>`;
  }).join('');
  $('#cli-lista').innerHTML = lista.length
    ? `<div class="fila-cli cab"><div>Cliente</div><div>As unhas dela</div><div>Última visita</div><div>Manutenção</div><div>Etiquetas</div></div>` + filas +

}

function statsServicios(){
  const desde = sumarDias(hoy(), -365), st = {};
  D().servicios.forEach(s => st[s.id] = { n:0, t:0 });
  D().turnos.forEach(t => { if (t.estado === 'realizado' && t.fecha >= desde && st[t.serv]) st[t.serv].n++; });
  D().movs.forEach(m => { if (m.tipo === 'ing' && m.serv && m.fecha >= desde && st[m.serv]) st[m.serv].t += m.monto; });
  return st;
}

        <div class="fila-fin"><div class="serv-p">${pesos(s.precio)}</div><span class="muted" style="font-size:12px">${ico('reloj')} ${s.dur} min</span></div>

      : `<div class="vacio card">${ico('catalogo')}Nenhum serviço com esse filtro.</div>`}`;
};
function formServicio(id){

function guardarServicio(id){

/* =====================================================================
   COBROS Y GASTOS (financeiro do salão) · lo que entra, lo que sale y lo que queda.
   Las retiradas de Eduarda NO son un gasto del salón: viven en Finanças pessoais
   (16-pessoal.js) y acá solo se muestran aparte, para ver cuánto quedó en caja.
   ===================================================================== */
const FIN = { vista:'mes', fecha:null, tipo:'', cat:'', medio:'', q:'', lim:50 };

function rangoFin(){
  const f = FIN.fecha;
  if (FIN.vista === 'dia') return [f, f];
  if (FIN.vista === 'mes') return [inicioMes(f), finMes(f)];
  const y = f.slice(0, 4); return [y + '-01-01', y + '-12-31'];
}
function etiquetaFin(){ const d = aFecha(FIN.fecha); return FIN.vista === 'dia' ? fLarga(FIN.fecha) : FIN.vista === 'mes' ? MESES[d.getMonth()] + ' de ' + d.getFullYear() : String(d.getFullYear()); }
function moverFin(n){ FIN.fecha = FIN.vista === 'dia' ? sumarDias(FIN.fecha, n) : FIN.vista === 'mes' ? sumarMeses(FIN.fecha, n) : sumarMeses(FIN.fecha, 12 * n); FIN.lim = 50; RENDER.cobros(); }
function movsFiltrados(){
  const [a, b] = rangoFin(), q = FIN.q.toLowerCase();
  return D().movs.filter(m => m.fecha >= a && m.fecha <= b && (!FIN.tipo || m.tipo === FIN.tipo) && (!FIN.cat || m.cat === FIN.cat) &&
    (!FIN.medio || m.medio === FIN.medio) && (!q || m.concepto.toLowerCase().includes(q) || (m.cli && cliente(m.cli) && cliente(m.cli).nombre.toLowerCase().includes(q))))
    .sort((x, y) => y.fecha.localeCompare(x.fecha));
}

RENDER.cobros = function(){
  if (!FIN.fecha) FIN.fecha = hoy();
  encabezado('Financeiro do salão', 'Os pagamentos dos atendimentos e os sinais entram sozinhos; as despesas você registra.',
    btnExportar('exportarFinanzas') +
    `<button class="btn btn-linea" onclick="formMov('egr')">${ico('gasto')} Registrar despesa</button>
     <button class="btn btn-oro" onclick="formMov('ing')">${ico('dinero')} Registrar entrada</button>`);
  const [a, b] = rangoFin();
  const enRango = D().movs.filter(m => m.fecha >= a && m.fecha <= b);
  const ing = sumaMovs(enRango, 'ing'), egr = sumaMovs(enRango, 'egr'), res = ing - egr;
  const retiradas = (D().pessoal || []).filter(p => p.tipo === 'ret' && p.fecha >= a && p.fecha <= b).reduce((s, p) => s + p.monto, 0);
  const cobrosServ = enRango.filter(m => m.tipo === 'ing' && m.cat === 'Atendimentos');
  const ticket = cobrosServ.length ? cobrosServ.reduce((s, m) => s + m.monto, 0) / cobrosServ.length : 0;

  // Servicios que más facturan (en el período)
  const porServ = {};
  enRango.filter(m => m.tipo === 'ing' && m.serv).forEach(m => { porServ[m.serv] = porServ[m.serv] || { n:0, t:0 }; porServ[m.serv].n++; porServ[m.serv].t += m.monto; });
  const top = Object.keys(porServ).map(k => ({ s:servicio(k), ...porServ[k] })).filter(x => x.s).sort((x, y) => y.t - x.t).slice(0, 6);
  const maxTop = top.length ? top[0].t : 1;
  // Egresos por categoría
  const porCat = {};
  enRango.filter(m => m.tipo === 'egr').forEach(m => porCat[m.cat] = (porCat[m.cat] || 0) + m.monto);
  const cats = Object.keys(porCat).sort((x, y) => porCat[y] - porCat[x]), maxCat = cats.length ? porCat[cats[0]] : 1;
  // Ingresos por medio de pago
  const porMedio = {}; enRango.filter(m => m.tipo === 'ing').forEach(m => porMedio[m.medio] = (porMedio[m.medio] || 0) + m.monto);

  const barra = (t, v, max, extra, color) => `<div class="barra-h"><div class="fila-fin"><span>${t}</span><span class="num fuerte">${pesos(v)}${extra ? ` <span class="muted" style="font-weight:500">${extra}</span>` : ''}</span></div>
    <div class="avance"><span style="width:${Math.max(2, v / max * 100)}%;${color ? 'background:' + color : ''}"></span></div></div>`;

  const lista = movsFiltrados();
  $('#vista').innerHTML = `<div class="ag-herr">
      <div class="fila"><div class="segmento">${[['dia','Dia'],['mes','Mês'],['anio','Ano']].map(([k, t]) => `<button class="${FIN.vista === k ? 'on' : ''}" onclick="FIN.vista='${k}'; FIN.lim=50; RENDER.cobros()">${t}</button>`).join('')}</div>
        <div class="navfecha"><button class="icon-btn" onclick="moverFin(-1)" aria-label="Anterior">${ico('izq')}</button><span class="lbl">${etiquetaFin()}</span>
          <button class="icon-btn" onclick="moverFin(1)" aria-label="Próximo">${ico('der')}</button></div>
        <button class="btn btn-linea btn-sm" onclick="FIN.fecha=hoy(); RENDER.cobros()">Hoje</button></div></div>
    <div class="grid g-4 revelar">
      <div class="kpi"><div class="kpi-l">${ico('dinero')} Entradas</div><div class="kpi-v pos">${pesos(ing)}</div><div class="kpi-d">${enRango.filter(m => m.tipo === 'ing').length} movimentos</div></div>
      <div class="kpi"><div class="kpi-l">${ico('gasto')} Despesas do salão</div><div class="kpi-v">${pesos(egr)}</div><div class="kpi-d">${enRango.filter(m => m.tipo === 'egr').length} movimentos</div></div>
      <div class="kpi ${res < 0 ? 'alerta' : ''}"><div class="kpi-l">${ico('finanzas')} Lucro do salão</div><div class="kpi-v ${res >= 0 ? 'pos' : ''}">${pesos(res)}</div>
        <div class="kpi-d">${retiradas ? `retiradas ${pesos(retiradas)} · <a class="link" href="#pessoal">ficou no caixa ${pesos(res - retiradas)}</a>` : ing ? 'margem ' + pct(res / ing * 100) : '—'}</div></div>
      <div class="kpi"><div class="kpi-l">${ico('estrella')} Ticket médio</div><div class="kpi-v">${pesos(ticket)}</div><div class="kpi-d">por cliente atendida</div></div>
    </div>
    <div class="grid mt" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)" id="fin-g1">
      <div class="card revelar"><div class="card-cab"><div class="card-t">Entradas vs. despesas<small>${FIN.vista === 'anio' ? 'Mês a mês, ' + FIN.fecha.slice(0, 4) : 'Últimos 6 meses'}</small></div>
        <div class="graf-ley"><span><i style="background:var(--oro)"></i>Entradas</span><span><i style="background:#DCD3C9"></i>Despesas</span></div></div>${graficoFin()}</div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Serviços que mais rendem<small>${etiquetaFin()}</small></div></div>
        ${top.length ? top.map(x => barra(esc(x.s.nombre), x.t, maxTop, '· ' + x.n)).join('') : '<div class="vacio">Nenhum serviço recebido neste período.</div>'}</div>
    </div>
    <div class="grid g-2 mt">
      <div class="card revelar"><div class="card-cab"><div class="card-t">Despesas por categoria</div></div>
        ${cats.length ? cats.map(c => barra(esc(c), porCat[c], maxCat, '', '#C9B8A8')).join('') : '<div class="vacio">Nenhuma despesa neste período.</div>'}</div>
      <div class="card revelar"><div class="card-cab"><div class="card-t">Entradas por forma de pagamento</div></div>
        ${MEDIOS_PAGO.map(m => barra(m, porMedio[m] || 0, Math.max(1, ...Object.values(porMedio)), ing ? '· ' + pct((porMedio[m] || 0) / ing * 100) : '')).join('')}</div>
    </div>
    <div class="card-cab mt" style="margin-top:28px"><div class="card-t">Movimentos <span class="card-num">${lista.length}</span></div></div>
    <div class="herr">
      <div class="buscar">${ico('buscar')}<input type="search" id="fin-q" placeholder="Buscar descrição ou cliente…" value="${esc(FIN.q)}" oninput="FIN.q=this.value; FIN.lim=50; pintarMovs()"></div>
      <select class="sel" onchange="FIN.tipo=this.value; FIN.cat=''; RENDER.cobros()"><option value="">Entradas e despesas</option><option value="ing" ${FIN.tipo === 'ing' ? 'selected' : ''}>Só entradas</option><option value="egr" ${FIN.tipo === 'egr' ? 'selected' : ''}>Só despesas</option></select>
      <select class="sel" onchange="FIN.cat=this.value; pintarMovs()"><option value="">Todas as categorias</option>${(FIN.tipo === 'egr' ? CAT_EGRESO : FIN.tipo === 'ing' ? CAT_INGRESO : CAT_INGRESO.concat(CAT_EGRESO)).map(c => `<option ${FIN.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <select class="sel" onchange="FIN.medio=this.value; pintarMovs()"><option value="">Todas as formas</option>${MEDIOS_PAGO.map(m => `<option ${FIN.medio === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
    </div>
    <div class="tabla-caja" id="fin-movs"></div>`;
  pintarMovs();
  if (window.innerWidth < 900) $('#fin-g1').style.gridTemplateColumns = 'minmax(0,1fr)';
};
function pintarMovs(){
  const lista = movsFiltrados();
  $('#fin-movs').innerHTML = lista.length ? `<div class="tabla-scroll"><table class="tabla tabla-movs"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma</th><th class="derecha">Valor</th></tr></thead><tbody>
    ${lista.slice(0, FIN.lim).map(m => { const c = m.cli ? cliente(m.cli) : null; return `<tr class="clic" onclick="verMov('${m.id}')">
      <td class="num" style="white-space:nowrap">${fCorta(m.fecha)}</td>
      <td><div class="fuerte">${esc(m.concepto)}</div>${c ? `<div class="persona-s">${esc(c.nombre)}</div>` : ''}</td>
      <td><span class="chip ${m.tipo === 'ing' ? 'c-ok' : 'c-gris'} sin-punto">${esc(m.cat)}</span></td>
      <td class="t2">${m.medio}</td>
      <td class="derecha num fuerte ${m.tipo === 'ing' ? 'pos' : 'neg'}" style="white-space:nowrap">${m.tipo === 'ing' ? '+' : '−'} ${pesos(m.monto)}</td></tr>`; }).join('')}
    </tbody></table></div>${lista.length > FIN.lim ? `<div class="mas-filas"><button class="btn btn-linea btn-sm" onclick="FIN.lim+=50; pintarMovs()">Ver mais (${lista.length - FIN.lim})</button></div>` : ''}`
    : `<div class="vacio">${ico('finanzas')}Nenhum movimento com esses filtros.</div>`;
}

/* Gráfico de barras (SVG, sin librerías) */
function graficoFin(){
  let meses = [];
  if (FIN.vista === 'anio'){ const y = FIN.fecha.slice(0, 4); for (let m = 1; m <= 12; m++) meses.push(y + '-' + p2(m)); }
  else for (let k = 5; k >= 0; k--) meses.push(mesClave(sumarMeses(FIN.fecha, -k)));
  const datos = meses.map(mk => { const l = D().movs.filter(m => mesClave(m.fecha) === mk); return { mk, ing:sumaMovs(l, 'ing'), egr:sumaMovs(l, 'egr') }; });
  const max = Math.max(1, ...datos.map(x => Math.max(x.ing, x.egr))) * 1.12;
  const W = 640, H = 240, izq = 54, abajo = 26, arr = 10, ancho = (W - izq - 6) / datos.length, bw = Math.min(26, ancho * .3);
  const y = v => arr + (H - arr - abajo) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = max / 1.12 * i / 4; g += `<line x1="${izq}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#F0E9E1"/><text x="${izq - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? Math.round(v / 1000) + ' mil' : Math.round(v)}</text>`; }
  datos.forEach((x, i) => {
    const cx = izq + ancho * i + ancho / 2, d = aFecha(x.mk + '-01');
    g += `<g class="mes"><title>${MESES[d.getMonth()]}: entradas ${pesos(x.ing)} · despesas ${pesos(x.egr)} · lucro ${pesos(x.ing - x.egr)}</title>
      <rect class="b-ing" x="${cx - bw - 2}" y="${y(x.ing)}" width="${bw}" height="${Math.max(0, H - abajo - y(x.ing))}" rx="4"/>
      <rect class="b-egr" x="${cx + 2}" y="${y(x.egr)}" width="${bw}" height="${Math.max(0, H - abajo - y(x.egr))}" rx="4"/>
      <text x="${cx}" y="${H - 8}" text-anchor="middle" ${x.mk === mesClave(FIN.fecha) ? 'style="fill:var(--grafito);font-weight:700"' : ''}>${MESES_C[d.getMonth()]}</text></g>`;
  });
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de entradas e despesas por mês">
    <defs><linearGradient id="gradOro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4A58C"/><stop offset="1" stop-color="#A8705A"/></linearGradient></defs>${g}</svg>`;
}

/* ---------- Ver / cargar movimientos ---------- */
function verMov(id){
  const m = D().movs.find(x => x.id === id); if (!m) return;
  const auto = m.turno || m.compra;
  if (!auto) return formMov(m.tipo, id);
  const origen = m.cat === 'Sinais' ? 'o sinal de um agendamento' : m.turno ? 'um atendimento finalizado na agenda' : 'uma compra de materiais';
  abrirModal({
    titulo: esc(m.concepto), sub: fLarga(m.fecha) + ' · ' + m.medio,
    cuerpo: `<div class="kpi-v ${m.tipo === 'ing' ? 'pos' : 'neg'}" style="margin:0 0 12px">${m.tipo === 'ing' ? '+' : '−'} ${pesos(m.monto)}</div>
      <div class="caja-info">${ico('info')}<div>Este movimento foi registrado sozinho, a partir de ${origen}.${m.cat === 'Sinais' ? ' Se você devolveu o sinal, pode excluí-lo.' : ''}</div></div>`,
    pie: `${m.cat === 'Sinais' ? `<button class="btn btn-peligro izq" onclick="eliminarMov('${m.id}')">${ico('borrar')} Excluir sinal</button>` : ''}
      ${m.cli ? `<button class="btn btn-linea" onclick="verCliente('${m.cli}')">Ver cliente</button>` : ''}
      ${m.turno && turno(m.turno) ? `<button class="btn btn-linea" onclick="verTurno('${m.turno}')">Ver atendimento</button>` : ''}
      <button class="btn btn-oro" onclick="cerrarModal()">Pronto</button>`
  });
}
function formMov(tipo, id){
  const m = id ? D().movs.find(x => x.id === id) : { tipo, fecha:hoy(), cat: tipo === 'ing' ? 'Outras entradas' : 'Outras despesas', concepto:'', monto:'', medio:'Pix', cli:'' };
  const esIng = m.tipo === 'ing';
  abrirModal({
    titulo: id ? 'Editar movimento' : (esIng ? 'Registrar entrada' : 'Registrar despesa do salão'),
    sub: esIng ? 'Os pagamentos dos atendimentos entram sozinhos ao marcá-los como «Finalizado».' : 'Aluguel, materiais, publicidade, cursos… (os gastos pessoais vão em Finanças pessoais)',
    cuerpo: `<form class="form" id="f-mov" onsubmit="return false">
      ${campo('Descrição', inp('concepto', m.concepto, 'text', `placeholder="${esIng ? 'Ex.: vale-presente, unhas de noiva…' : 'Ex.: aluguel de novembro'}"`), { ancho:true })}
      ${campo('Valor (R$)', inp('monto', m.monto, 'number', 'min="0" step="5"'))}
      ${campo('Data', inp('fecha', m.fecha, 'date'))}
      ${campo('Categoria', sel('cat', esIng ? CAT_INGRESO : CAT_EGRESO, m.cat))}
      ${campo('Forma de pagamento', sel('medio', MEDIOS_PAGO, m.medio))}
      ${esIng ? campo('Cliente (opcional)', sel('cli', [['', '—']].concat(D().clientes.slice().sort((a, b) => a.nombre.localeCompare(b.nombre)).map(c => [c.id, c.nombre])), m.cli), { ancho:true }) : ''}
    </form>`,
    pie: (id ? `<button class="btn btn-peligro izq" onclick="eliminarMov('${id}')">${ico('borrar')} Excluir</button>` : '') +
      `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-oro" onclick="guardarMov('${m.tipo}','${id || ''}')">Salvar</button>`
  });
}
function guardarMov(tipo, id){
  const v = leerForm($('#f-mov'));
  if (!v.concepto) return avisar('Escreva a descrição', 'alerta');
  if (!(v.monto > 0)) return avisar('Informe o valor', 'alerta');
  const datos = { fecha:v.fecha || hoy(), cat:v.cat, concepto:v.concepto, monto:Number(v.monto), medio:v.medio, cli:v.cli || null };
  if (id) Object.assign(D().movs.find(x => x.id === id), datos); else nuevoMov(Object.assign({ tipo }, datos));
  guardar(); cerrarModal(); refrescar(); avisar(tipo === 'ing' ? 'Entrada registrada' : 'Despesa registrada', tipo === 'ing' ? 'dinero' : 'gasto');
}
async function eliminarMov(id){
  if (!(await confirmar('Excluir o movimento?', 'Ele sai do Financeiro do salão.', 'Excluir', true))) return;
  borrarMov(id); guardar(); cerrarModal(); refrescar(); avisar('Movimento excluído', 'borrar');
}
function exportarFinanzas(){
  exportarCSV('Financeiro do salão ' + etiquetaFin(), ['Data','Tipo','Categoria','Descrição','Cliente','Forma de pagamento','Valor'],
    movsFiltrados().map(m => [fCorta(m.fecha), m.tipo === 'ing' ? 'Entrada' : 'Despesa', m.cat, m.concepto, m.cli && cliente(m.cli) ? cliente(m.cli).nombre : '', m.medio, (m.tipo === 'ing' ? 1 : -1) * m.monto]));
}
